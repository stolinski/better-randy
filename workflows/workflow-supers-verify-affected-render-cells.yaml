id: 68b70b23-dfe3-46e7-b3b0-a5b180e4d2ad
name: supers-verify-affected-render-cells
description: Verify the conservative union of render cells selected by the canonical change-impact resource.
version: 1
tags:
  purpose: render-matrix-verification
inputs:
  type: object
  properties:
    workItem:
      type: string
      pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
    expectedFingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
  required:
    - workItem
    - expectedFingerprint
  additionalProperties: false
jobs:
  - name: main
    description: Assert source freshness, run one affected internal fan-out, reassert freshness, then gate objective data.
    dependsOn: []
    steps:
      - name: assert-change-state
        description: Reject source drift before deriving the live matrix.
        dependsOn: []
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: assert-change-state
          inputs:
            expectedFingerprint: '${{ inputs.expectedFingerprint }}'
      - name: verify-affected
        description: Execute one typed model method over the conservative union of affected cells.
        dependsOn:
          - step: assert-change-state
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: supers-render-verification
          methodName: verify-render-matrix
          inputs:
            schemaVersion: 1
            scope: affected
            workItem: '${{ inputs.workItem }}'
            renderRequired: true
            expectedTreeFingerprint: '${{ inputs.expectedFingerprint }}'
            changedPaths: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.treeFingerprint == inputs.expectedFingerprint)[0].attributes.paths }}'
      - name: assert-change-state-after
        description: Reject source drift after the full fan-out even when objective findings are red.
        dependsOn:
          - step: verify-affected
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: assert-change-state
          inputs:
            expectedFingerprint: '${{ inputs.expectedFingerprint }}'
      - name: assert-objective-result
        description: Gate only the current workflow run's objective outcome; advisories have no authority.
        dependsOn:
          - step: assert-change-state-after
            condition:
              type: succeeded
        task:
          type: assert
          expr: 'data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.expectedTreeFingerprint == inputs.expectedFingerprint)[0].attributes.status == ''not-applicable'' || data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.expectedTreeFingerprint == inputs.expectedFingerprint)[0].attributes.outcome == ''pass'''
          message: Affected render cells contain objective failures or unavailable evidence.
          severity: high
    weight: 0
