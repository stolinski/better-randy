id: 41b30cb4-5142-4f41-9fd3-b0a2a718c4a7
name: supers-delivery-deterministic-verification
description: Derive the Delivery route only from fresh correlated deterministic verification resources.
version: 7
tags:
  purpose: delivery-deterministic-routing
inputs:
  type: object
  properties:
    workItem:
      type: string
      pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
  required: [workItem]
  additionalProperties: false
jobs:
  - name: main
    description: Verify one classified tree and persist the normalized closed-objective route.
    dependsOn: []
    steps:
      - name: refresh-exact-change-classification
        description: Reclassify only the verified integration paths before selecting verification lanes.
        dependsOn: []
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: classify-change
          inputs:
            workItem: '${{ inputs.workItem }}'
            expectedBaselineRevision: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-change-summary").attributes.payload.integrationReceipt.targetBaselineRevision }}'
            expectedIntegratedRevision: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-change-summary").attributes.payload.integrationReceipt.integratedRevision }}'
            expectedChangedPaths: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-change-summary").attributes.payload.integrationReceipt.changedPaths }}'
      - name: assert-change-state
        dependsOn:
          - step: refresh-exact-change-classification
            condition: { type: succeeded }
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: assert-change-state
          inputs:
            expectedFingerprint: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint }}'
            expectedPaths: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.paths }}'
      - name: policy-sweep
        description: Run universal lifecycle-integrity policy before domain-specific verification.
        dependsOn:
          - step: assert-change-state
            condition: { type: succeeded }
        task:
          type: workflow
          workflowIdOrName: policy-sweep
          inputs:
            workItem: '${{ inputs.workItem }}'
            routingWorkflowRunId: '${{ run.id }}'
        allowFailure: true
      - name: deterministic-lanes
        dependsOn:
          - step: policy-sweep
            condition: { type: completed }
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: run-verification-fanout
          inputs:
            workItem: '${{ inputs.workItem }}'
            expectedFingerprint: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint }}'
      - name: verify-affected-render-matrix
        dependsOn:
          - step: deterministic-lanes
            condition: { type: succeeded }
        task:
          type: model_method
          modelIdOrName: supers-render-verification
          methodName: verify-render-matrix
          inputs:
            schemaVersion: 1
            scope: affected
            workItem: '${{ inputs.workItem }}'
            expectedTreeFingerprint: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint }}'
            expectedSourceRevision: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-change-summary").attributes.payload.integrationReceipt.integratedRevision }}'
            changedPaths: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.paths }}'
            renderRequired: '${{ size(data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.lanes.filter(lane, lane.id in ["render-matrix", "pack-matrix"])) > 0 }}'
      - name: assert-change-state-after
        dependsOn:
          - step: verify-affected-render-matrix
            condition: { type: succeeded }
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: assert-change-state
          inputs:
            expectedFingerprint: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint }}'
            expectedPaths: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.paths }}'
      - name: normalize-route
        dependsOn:
          - step: assert-change-state-after
            condition: { type: succeeded }
        task:
          type: model_method
          modelIdOrName: supers-delivery-verification-router
          methodName: normalize-verification-route
          inputs:
            schemaVersion: 1
            workItem: '${{ inputs.workItem }}'
            expectedWorkflowRunId: '${{ run.id }}'
            expectedIntegratedRevision: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-change-summary").attributes.payload.integrationReceipt.integratedRevision }}'
            expectedIntegratedTreeFingerprint: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-change-summary").attributes.payload.integrationReceipt.integratedTreeFingerprint }}'
            expectedTreeFingerprint: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint }}'
            changeImpact:
              resourceName: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].name }}'
              workItem: '${{ inputs.workItem }}'
              treeFingerprint: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint }}'
              workflowRunId: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].workflowRunId }}'
              paths: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.paths }}'
              classification: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.classification }}'
              unknownPaths: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.unknownPaths }}'
              intentRouteDigest: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.intentRouteDigest }}'
              surfaces: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.surfaces }}'
              requiredHumanReviews: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.requiredHumanReviews }}'
            requiredLaneIds: '${{ data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.lanes.map(lane, lane.id) }}'
            deterministicFanoutResourceName: '${{ data.query(''modelName == "repo-audit" && specName == "verification-fanout" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.expectedFingerprint == data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint)[0].name }}'
            deterministicFanoutWorkflowRunId: '${{ data.query(''modelName == "repo-audit" && specName == "verification-fanout" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.expectedFingerprint == data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint)[0].workflowRunId }}'
            deterministicFanout: '${{ data.query(''modelName == "repo-audit" && specName == "verification-fanout" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.expectedFingerprint == data.query(''modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint)[0].attributes }}'
            policySweepResourceName: '${{ data.query(''modelName == "supers-delivery-verification-router" && specName == "policy-sweep-execution"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.routingWorkflowRunId == run.id)[0].name }}'
            policySweepResourceWorkflowRunId: '${{ data.query(''modelName == "supers-delivery-verification-router" && specName == "policy-sweep-execution"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.routingWorkflowRunId == run.id)[0].workflowRunId }}'
            policySweepExecution: '${{ data.query(''modelName == "supers-delivery-verification-router" && specName == "policy-sweep-execution"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.routingWorkflowRunId == run.id)[0].attributes }}'
            renderMatrixRunName: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].name }}'
            renderMatrixRunWorkflowRunId: '${{ run.id }}'
            renderMatrixRun: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes }}'
            renderMatrixManifestName: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.status == "completed" ? data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.manifestName : "" }}'
            renderMatrixManifestWorkflowRunId: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.status == "completed" ? run.id : "" }}'
            renderMatrixManifest: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.status == "completed" ? data.query(''modelName == "supers-render-verification" && specName == "render-matrix-manifest" && workflowRunId == "'' + run.id + ''"'').filter(record, record.name == data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'')[0].attributes.manifestName)[0].attributes : null }}'
            renderMatrixBundleName: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.status == "completed" ? data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.bundleName : "" }}'
            renderMatrixBundleWorkflowRunId: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.status == "completed" ? run.id : "" }}'
            renderMatrixBundle: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.status == "completed" ? data.query(''modelName == "supers-render-verification" && specName == "render-matrix-bundle" && workflowRunId == "'' + run.id + ''"'').filter(record, record.name == data.query(''modelName == "supers-render-verification" && specName == "render-matrix-run" && workflowRunId == "'' + run.id + ''"'')[0].attributes.bundleName)[0].attributes : null }}'
      - name: record-verification
        dependsOn:
          - step: normalize-route
            condition: { type: succeeded }
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: record_artifact
          inputs:
            workItem: '${{ inputs.workItem }}'
            name: verification
            payload: '${{ data.query(''modelName == "supers-delivery-verification-router" && specName == "delivery-verification-route" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.workflowRunId == run.id)[0].attributes }}'
      - name: record-verification-evidence
        dependsOn:
          - step: record-verification
            condition: { type: succeeded }
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: record_evidence
          inputs:
            workItem: '${{ inputs.workItem }}'
            name: verification-run
            payload:
              status: succeeded
              runId: '${{ run.id }}'
              workflow: supers-delivery-deterministic-verification
    weight: 0
