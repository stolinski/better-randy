id: 38593822-8e59-4a31-8ef4-8a308fcfbadf
name: supers-planning-audit
description: Audit approved-plan mappings against one fresh official Dex snapshot.
tags:
  purpose: supers-planning-factory
inputs:
  type: object
  properties:
    workItem:
      type: string
      minLength: 1
    approvedPlan:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        planId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        tasks:
          type: array
          minItems: 1
          maxItems: 250
          items:
            type: object
            properties:
              kind:
                type: string
                enum:
                  - create
                  - attachExisting
            required:
              - kind
            additionalProperties: true
      required:
        - schemaVersion
        - planId
        - tasks
      additionalProperties: false
    application:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        status:
          type: string
          enum:
            - succeeded
            - failed
        planId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        planHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        idempotencyKey:
          type: string
          pattern: ^[0-9a-f]{64}$
        attempt:
          type: integer
          minimum: 1
        checkpointDataName:
          type: string
          minLength: 1
        receiptDataName:
          type: string
          minLength: 1
        resultDataName:
          type: string
        mappings:
          type: array
          items:
            type: object
            properties:
              clientRef:
                type: string
                pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
                maxLength: 64
              dexTaskId:
                type: string
                pattern: ^[A-Za-z0-9_-]{1,128}$
                maxLength: 128
              disposition:
                type: string
                enum:
                  - created
                  - attachedExisting
            required:
              - clientRef
              - dexTaskId
              - disposition
            additionalProperties: false
        retryDisposition:
          type: string
          enum:
            - none
            - retry
            - do-not-retry
            - manual-review
        errorCode:
          type: string
        summary:
          type: string
          minLength: 1
      required:
        - schemaVersion
        - status
        - planId
        - planHash
        - idempotencyKey
        - attempt
        - checkpointDataName
        - receiptDataName
        - resultDataName
        - mappings
        - retryDisposition
        - errorCode
        - summary
      additionalProperties: false
    documentationEffects:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        effects:
          type: array
          items:
            type: object
            properties:
              operation:
                type: string
                enum:
                  - create
                  - update
                  - retire
                  - no-change
              documentKind:
                type: string
                minLength: 1
              target:
                type: string
                minLength: 1
              rationale:
                type: string
                minLength: 1
            required:
              - operation
              - documentKind
              - target
              - rationale
            additionalProperties: false
        summary:
          type: string
          minLength: 1
        sourceSnapshotFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        planningInventoryFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        trackerInventoryFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        intentFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - schemaVersion
        - effects
        - summary
        - sourceSnapshotFingerprint
        - planningInventoryFingerprint
        - trackerInventoryFingerprint
        - intentFingerprint
        - fingerprint
      additionalProperties: false
  required:
    - workItem
    - approvedPlan
    - application
    - documentationEffects
  additionalProperties: false
jobs:
  - name: main
    description: Audit approved-plan mappings against one fresh official Dex snapshot.
    steps:
      - name: audit-planning-application
        description: Verify actual mapped Dex tasks and documentation proposal integrity.
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: audit-planning-application
          inputs:
            workItem: ${{ inputs.workItem }}
            approvedPlan: ${{ inputs.approvedPlan }}
            application: ${{ inputs.application }}
            documentationEffects: ${{ inputs.documentationEffects }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-planning-audit
        description: Record exact planning-audit output in the active Planning Factory.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: planning-audit
            payload: ${{ data.query('modelName == "repo-audit" && specName == "planning-application-audit" && workflowRunId == "' + run.id + '"')[0].attributes }}
        dependsOn:
          - step: audit-planning-application
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: record-planning-audit-run
        description: Record correlated planning-audit-run workflow evidence.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: planning-audit-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              workflow: supers-planning-audit
        dependsOn:
          - step: record-planning-audit
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
