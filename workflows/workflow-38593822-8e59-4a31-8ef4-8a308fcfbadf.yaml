id: 38593822-8e59-4a31-8ef4-8a308fcfbadf
name: supers-planning-audit
description: Audit promotion authority, cleanup, and optional Dex mappings against the exact reviewed bundle.
tags:
  purpose: supers-planning-factory
inputs:
  type: object
  properties:
    workItem:
      type: string
      minLength: 1
    reviewedPlan:
      type: object
      additionalProperties: true
    applicationBundle:
      type: object
      additionalProperties: true
    applicationBundleValidation:
      type: object
      additionalProperties: true
    application:
      type: object
      additionalProperties: true
    documentationEffects:
      type: object
      additionalProperties: true
  required:
    - workItem
    - reviewedPlan
    - applicationBundle
    - applicationBundleValidation
    - application
    - documentationEffects
  additionalProperties: false
jobs:
  - name: main
    description: Verify the promotion receipt and any mapped Dex graph before Planning handoff.
    steps:
      - name: audit-planning-promotion
        description: Verify exact authority, cleanup, content hashes, and route-correct Dex evidence.
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: audit-planning-promotion
          inputs:
            workItem: ${{ inputs.workItem }}
            reviewedPlan: ${{ inputs.reviewedPlan }}
            applicationBundle: ${{ inputs.applicationBundle }}
            applicationBundleValidation: ${{ inputs.applicationBundleValidation }}
            application: ${{ inputs.application }}
            documentationEffects: ${{ inputs.documentationEffects }}
            promotionResult: ${{ data.latest("supers-planning-promotion", inputs.application.resultDataName).attributes }}
            promotionReceipt: ${{ data.latest("supers-planning-promotion", inputs.application.receiptDataName).attributes }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-planning-audit
        description: Record exact planning-audit output in the active Planning Factory.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: planning-audit
            payload: ${{ data.query('modelName == "repo-audit" && specName == "planning-application-audit" && workflowRunId == "' + run.id + '"')[0].attributes }}
        dependsOn:
          - step: audit-planning-promotion
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: record-planning-audit-run
        description: Record correlated planning-audit-run workflow evidence.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: planning-audit-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              workflow: supers-planning-audit
        dependsOn:
          - step: record-planning-audit
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 2
