id: bf680a62-cecc-4594-b86c-21dece48cade
name: supers-planning-validate-promotion-bundle
description: Validate and record one complete Supers promotion preview without mutating repository state.
tags:
  purpose: supers-planning-factory
inputs:
  type: object
  properties:
    workItem:
      type: string
      minLength: 1
    inventory:
      type: object
      additionalProperties: true
    trackerInventory:
      type: object
      additionalProperties: true
    documentationEffects:
      type: object
      additionalProperties: true
    reviewedPlan:
      type: object
      additionalProperties: true
    applicationBundle:
      type: object
      additionalProperties: true
  required:
    - workItem
    - inventory
    - trackerInventory
    - documentationEffects
    - reviewedPlan
    - applicationBundle
  additionalProperties: false
jobs:
  - name: main
    description: Validate the exact route, preimages, writes, indexes, and optional Dex graph before review.
    steps:
      - name: validate-promotion-bundle
        description: Bind the complete promotion preview to immutable Planning evidence.
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: validate-promotion-bundle
          inputs:
            workItem: ${{ inputs.workItem }}
            inventory: ${{ inputs.inventory }}
            trackerInventory: ${{ inputs.trackerInventory }}
            documentationEffects: ${{ inputs.documentationEffects }}
            reviewedPlan: ${{ inputs.reviewedPlan }}
            applicationBundle: ${{ inputs.applicationBundle }}
            sourceSnapshot: ${{ data.latest("repo-audit", inputs.inventory.sourceSnapshotName).attributes }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-application-bundle-validation
        description: Record the exact validated bundle envelope in the active Planning Factory.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: application-bundle-validation
            payload: ${{ data.query('modelName == "repo-audit" && specName == "application-bundle-validation" && workflowRunId == "' + run.id + '"')[0].attributes }}
        dependsOn:
          - step: validate-promotion-bundle
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: record-application-bundle-validation-run
        description: Record correlated application-bundle-validation-run workflow evidence.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: application-bundle-validation-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              workflow: supers-planning-validate-promotion-bundle
        dependsOn:
          - step: record-application-bundle-validation
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
