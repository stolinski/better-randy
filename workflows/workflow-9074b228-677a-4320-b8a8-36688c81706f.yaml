id: 9074b228-677a-4320-b8a8-36688c81706f
name: supers-planning-tracker-inventory
description: Derive and record related Dex work without re-fetching repository facts.
tags:
  purpose: supers-planning-factory
inputs:
  type: object
  properties:
    workItem:
      type: string
      minLength: 1
    inventory:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        objective:
          type: string
          minLength: 1
        contextRefs:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
              reference:
                type: string
                minLength: 1
              summary:
                type: string
                minLength: 1
            required:
              - kind
              - name
              - reference
              - summary
            additionalProperties: false
        unresolvedDecisions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              question:
                type: string
                minLength: 1
              reason:
                type: string
                minLength: 1
            required:
              - id
              - question
              - reason
            additionalProperties: false
        clarificationRequired:
          type: boolean
        sourceSnapshotName:
          type: string
          minLength: 1
        sourceSnapshotFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - schemaVersion
        - objective
        - contextRefs
        - unresolvedDecisions
        - clarificationRequired
        - sourceSnapshotName
        - sourceSnapshotFingerprint
        - fingerprint
      additionalProperties: false
  required:
    - workItem
    - inventory
  additionalProperties: false
jobs:
  - name: main
    description: Derive and record related Dex work without re-fetching repository facts.
    steps:
      - name: derive-tracker-inventory
        description: Derive related Dex work from the immutable source snapshot.
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: derive-tracker-inventory
          inputs:
            workItem: ${{ inputs.workItem }}
            inventory: ${{ inputs.inventory }}
            sourceSnapshot: ${{ data.latest("repo-audit", inputs.inventory.sourceSnapshotName).attributes }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-tracker-inventory
        description: Record exact tracker-inventory output in the active Planning Factory.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: tracker-inventory
            payload: ${{ data.query('modelName == "repo-audit" && specName == "tracker-inventory" && workflowRunId == "' + run.id + '"')[0].attributes }}
        dependsOn:
          - step: derive-tracker-inventory
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: record-tracker-inventory-run
        description: Record correlated tracker-inventory-run workflow evidence.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: tracker-inventory-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              workflow: supers-planning-tracker-inventory
        dependsOn:
          - step: record-tracker-inventory
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
