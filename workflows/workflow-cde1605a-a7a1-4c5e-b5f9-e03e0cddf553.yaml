id: cde1605a-a7a1-4c5e-b5f9-e03e0cddf553
name: supers-bind-human-aesthetic-decision
description: Bind the trusted current-cycle Factory aesthetic approval to the exact verified render bundle.
version: 2
tags:
  purpose: human-aesthetic-decision-binding
inputs:
  type: object
  properties:
    workItem:
      type: string
      pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
  required: [workItem]
  additionalProperties: false
jobs:
  - name: main
    description: Refresh exact Factory resources, derive the decision, and record correlated products.
    dependsOn: []
    steps:
      - name: refresh-factory
        dependsOn: []
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: status
          inputs:
            workItem: '${{ inputs.workItem }}'
      - name: bind-decision
        dependsOn:
          - step: refresh-factory
            condition: { type: succeeded }
        task:
          type: model_method
          modelIdOrName: supers-delivery-verification-router
          methodName: bind-human-aesthetic-decision
          inputs:
            schemaVersion: 1
            workItem: '${{ inputs.workItem }}'
            factoryName: supers-delivery
            factoryStateResourceName: '${{ "state-" + inputs.workItem }}'
            factoryState: '${{ data.latest("supers-delivery", "state-" + inputs.workItem).attributes }}'
            factoryApprovalResourceName: '${{ "approval-" + inputs.workItem + "-aesthetic-acceptance" }}'
            factoryApproval: '${{ data.latest("supers-delivery", "approval-" + inputs.workItem + "-aesthetic-acceptance").attributes }}'
            verificationRouteResourceName: '${{ data.query(''modelName == "supers-delivery-verification-router" && specName == "delivery-verification-route"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.workflowRunId == data.latest("supers-delivery", "artifact-" + inputs.workItem + "-verification").attributes.payload.workflowRunId)[0].name }}'
            verificationRoute: '${{ data.query(''modelName == "supers-delivery-verification-router" && specName == "delivery-verification-route"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.workflowRunId == data.latest("supers-delivery", "artifact-" + inputs.workItem + "-verification").attributes.payload.workflowRunId)[0].attributes }}'
            matrixBundleResourceName: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-bundle" && workflowRunId == "'' + data.latest("supers-delivery", "artifact-" + inputs.workItem + "-verification").attributes.payload.workflowRunId + ''"'').filter(record, record.name == data.latest("supers-delivery", "artifact-" + inputs.workItem + "-verification").attributes.payload.renderMatrixBundleName && record.attributes.bundleDigest == data.latest("supers-delivery", "artifact-" + inputs.workItem + "-verification").attributes.payload.renderMatrixBundleDigest)[0].name }}'
            matrixBundle: '${{ data.query(''modelName == "supers-render-verification" && specName == "render-matrix-bundle" && workflowRunId == "'' + data.latest("supers-delivery", "artifact-" + inputs.workItem + "-verification").attributes.payload.workflowRunId + ''"'').filter(record, record.name == data.latest("supers-delivery", "artifact-" + inputs.workItem + "-verification").attributes.payload.renderMatrixBundleName && record.attributes.bundleDigest == data.latest("supers-delivery", "artifact-" + inputs.workItem + "-verification").attributes.payload.renderMatrixBundleDigest)[0].attributes }}'
      - name: record-human-decision
        dependsOn:
          - step: bind-decision
            condition: { type: succeeded }
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: record_artifact
          inputs:
            workItem: '${{ inputs.workItem }}'
            name: human-aesthetic-decision
            payload: '${{ data.query(''modelName == "supers-delivery-verification-router" && specName == "human-aesthetic-decision" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes }}'
      - name: record-human-decision-evidence
        dependsOn:
          - step: record-human-decision
            condition: { type: succeeded }
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: record_evidence
          inputs:
            workItem: '${{ inputs.workItem }}'
            name: human-aesthetic-decision-run
            payload:
              status: succeeded
              runId: '${{ run.id }}'
              workflow: supers-bind-human-aesthetic-decision
    weight: 0
