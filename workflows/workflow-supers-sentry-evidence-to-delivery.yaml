id: 14aabbc8-d331-482e-89a9-15289a231ec1
name: supers-sentry-evidence-to-delivery
description: Collect one observed Sentry error, map one Dex repair, fix it, run normal Delivery checks, and resolve the issue.
tags:
  purpose: supers-sentry-self-healing-admission
  capability: observed-error-machine-delivery
inputs:
  type: object
  required:
    - repairIntentName
    - expectedRepairIntentFingerprint
    - queueSelectionName
    - expectedQueueSelectionFingerprint
  additionalProperties: false
  properties:
    repairIntentName:
      type: string
      minLength: 1
      maxLength: 220
    expectedRepairIntentFingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
    queueSelectionName:
      type: string
      minLength: 1
      maxLength: 220
    expectedQueueSelectionFingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
jobs:
  - name: main
    description: Use the original Sentry event as the repair trigger; reproduction is not required.
    steps:
      - name: collect-exact-sentry-evidence
        description: Fetch the fresh issue event, stack, breadcrumbs, and advisory Seer analysis for the exact queue head.
        task:
          type: model_method
          modelIdOrName: supers-sentry-issue-intake
          methodName: collect-repair-evidence
          inputs:
            repairIntentName: '${{ inputs.repairIntentName }}'
            expectedRepairIntentFingerprint: '${{ inputs.expectedRepairIntentFingerprint }}'
            queueSelectionName: '${{ inputs.queueSelectionName }}'
            expectedQueueSelectionFingerprint: '${{ inputs.expectedQueueSelectionFingerprint }}'
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: map-and-start-dex-repair
        description: Create or attach and start exactly one Dex task from the observed Sentry event.
        task:
          type: model_method
          modelIdOrName: supers-sentry-reproduction-transport
          methodName: map-evidenced
          inputs:
            evidenceName: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedEvidenceFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
        dependsOn:
          - step: collect-exact-sentry-evidence
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: record-machine-sentry-backlink
        description: Add one replay-safe Sentry comment linking the observed issue to its mapped Dex task.
        task:
          type: model_method
          modelIdOrName: supers-sentry-repair-planning-handoff
          methodName: record-machine-backlink
          inputs:
            repairIntent: '${{ data.latest("supers-sentry-repair-planning-handoff", inputs.repairIntentName).attributes }}'
            mapping: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes }}'
            admission: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission" && workflowRunId == "'' + run.id + ''"'')[0].attributes }}'
        dependsOn:
          - step: map-and-start-dex-repair
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-machine-delivery-admission
        description: Require the workflow-produced mapping and admission to authorize the same independent task while preserving human gates.
        task:
          type: assert
          expr: 'size(data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')) == 1 && size(data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission" && workflowRunId == "'' + run.id + ''"'')) == 1 && data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission" && workflowRunId == "'' + run.id + ''"'')[0].attributes.dexTaskId == data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId && data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission" && workflowRunId == "'' + run.id + ''"'')[0].attributes.preservesHumanAestheticGate'
          message: Sentry machine Delivery admission did not bind the exact Dex task
          severity: high
        dependsOn:
          - step: record-machine-sentry-backlink
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: start-delivery-factory
        description: Start Delivery for the exact observed-error Dex task; replay may encounter an already-started Factory state.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: start
          inputs:
            workItem: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId }}'
        dependsOn:
          - step: assert-machine-delivery-admission
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: materialize-delivery-status
        description: Require a queryable Delivery status for the exact task after start or replay.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: status
          inputs:
            workItem: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId }}'
        dependsOn:
          - step: start-delivery-factory
            condition:
              type: completed
        weight: 0
        allowFailure: false
      - name: drive-observed-error-fix
        description: Inspect, fix, integrate, run normal Delivery checks, and complete the Dex task.
        task:
          type: workflow
          workflowIdOrName: supers-sentry-factory-driver
          inputs:
            workItem: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId }}'
            evidenceName: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedEvidenceFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
            mappingName: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedMappingFingerprint: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
            admissionName: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedAdmissionFingerprint: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
        dependsOn:
          - step: materialize-delivery-status
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: resolve-fixed-sentry-issue
        description: Resolve the issue after the integrated fix passes normal Delivery checks; a later event is a new regression.
        task:
          type: workflow
          workflowIdOrName: supers-sentry-verified-resolution
          inputs:
            repairIntentName: '${{ inputs.repairIntentName }}'
            backlinkReceiptName: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "backlink-receipt" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            evidenceName: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedEvidenceFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
            dexTaskId: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId }}'
        dependsOn:
          - step: drive-observed-error-fix
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 2
