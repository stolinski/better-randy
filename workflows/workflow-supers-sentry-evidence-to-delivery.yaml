id: 14aabbc8-d331-482e-89a9-15289a231ec1
name: supers-sentry-evidence-to-delivery
description: Collect exact issue/event and advisory Seer evidence, map one started Dex repair, and converge its Delivery Factory state.
tags:
  purpose: supers-sentry-self-healing-admission
  capability: evidence-bound-machine-delivery
inputs:
  type: object
  required:
    - repairIntentName
    - expectedRepairIntentFingerprint
    - queueSelectionName
    - expectedQueueSelectionFingerprint
  additionalProperties: false
  properties:
    repairIntentName:
      type: string
      minLength: 1
      maxLength: 220
    expectedRepairIntentFingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
    queueSelectionName:
      type: string
      minLength: 1
      maxLength: 220
    expectedQueueSelectionFingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
jobs:
  - name: main
    description: Bind immutable diagnostics before any Dex or Factory mutation.
    steps:
      - name: collect-exact-sentry-evidence
        description: Fetch the fresh issue event, stack, breadcrumbs, and advisory Seer analysis for the exact queue head.
        task:
          type: model_method
          modelIdOrName: supers-sentry-issue-intake
          methodName: collect-repair-evidence
          inputs:
            repairIntentName: '${{ inputs.repairIntentName }}'
            expectedRepairIntentFingerprint: '${{ inputs.expectedRepairIntentFingerprint }}'
            queueSelectionName: '${{ inputs.queueSelectionName }}'
            expectedQueueSelectionFingerprint: '${{ inputs.expectedQueueSelectionFingerprint }}'
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: map-and-start-dex-repair
        description: Create or attach and start exactly one Dex task from the workflow-produced evidence bundle.
        task:
          type: model_method
          modelIdOrName: supers-sentry-reproduction-transport
          methodName: map-evidenced
          inputs:
            evidenceName: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedEvidenceFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
        dependsOn:
          - step: collect-exact-sentry-evidence
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-machine-delivery-admission
        description: Require the workflow-produced mapping, admission, and singleton claim to authorize the same task while preserving human gates.
        task:
          type: assert
          expr: 'size(data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')) == 1 && size(data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission" && workflowRunId == "'' + run.id + ''"'')) == 1 && size(data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-claim" && workflowRunId == "'' + run.id + ''"'')) == 1 && data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission" && workflowRunId == "'' + run.id + ''"'')[0].attributes.dexTaskId == data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId && data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-claim" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId == data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId && data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission" && workflowRunId == "'' + run.id + ''"'')[0].attributes.preservesHumanAestheticGate'
          message: Sentry machine Delivery admission did not bind the exact claimed Dex task
          severity: high
        dependsOn:
          - step: map-and-start-dex-repair
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: start-delivery-factory
        description: Start Delivery for the exact evidence-bound Dex task; replay may encounter an already-started Factory state.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: start
          inputs:
            workItem: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId }}'
        dependsOn:
          - step: assert-machine-delivery-admission
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: materialize-delivery-status
        description: Require a queryable Delivery status for the exact evidence-bound task after start or replay.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: status
          inputs:
            workItem: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping" && workflowRunId == "'' + run.id + ''"'')[0].attributes.taskId }}'
        dependsOn:
          - step: start-delivery-factory
            condition:
              type: completed
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
