id: b5264e14-2d67-409b-a59d-063b2f569e9e
name: supers-complete-authorized-task
description: Complete one Delivery task through either the unchanged human gate or exact non-visual Sentry machine authority.
tags:
  purpose: supers-authorized-task-completion
inputs:
  type: object
  required: [workItem]
  additionalProperties: false
  properties:
    workItem:
      type: string
      minLength: 1
jobs:
  - name: main
    description: Choose exactly one completion authority without weakening ordinary human approval.
    steps:
      - name: complete-human-approved-task
        description: Preserve the ordinary task-specific human completion workflow.
        task:
          type: workflow
          workflowIdOrName: supers-complete-human-approved-task
          inputs:
            workItem: '${{ inputs.workItem }}'
        guard: '${{ size(data.query(''modelName == "supers-delivery" && specName == "artifact" && name == "artifact-'' + inputs.workItem + ''-sentry-machine-authorization"'')) == 1 }}'
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: complete-machine-sentry-task
        description: Complete only from the current exact non-visual Sentry authorization artifact.
        task:
          type: model_method
          modelIdOrName: supers-sentry-reproduction-transport
          methodName: complete-machine-sentry
          inputs:
            taskId: '${{ inputs.workItem }}'
            authorization: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-sentry-machine-authorization").attributes.payload }}'
        guard: '${{ size(data.query(''modelName == "supers-delivery" && specName == "artifact" && name == "artifact-'' + inputs.workItem + ''-sentry-machine-authorization"'')) != 1 }}'
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-machine-tracker-completion
        description: Record the same Factory evidence contract after idempotent machine completion.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: record_evidence
          inputs:
            workItem: '${{ inputs.workItem }}'
            name: tracker-completion
            payload:
              status: succeeded
              runId: '${{ run.id }}'
              model: supers-sentry-reproduction-transport
              method: complete-machine-sentry
              outputId: '${{ run.id }}'
              taskId: '${{ inputs.workItem }}'
              commitKind: commit
        guard: '${{ size(data.query(''modelName == "supers-delivery" && specName == "artifact" && name == "artifact-'' + inputs.workItem + ''-sentry-machine-authorization"'')) != 1 }}'
        dependsOn:
          - step: complete-machine-sentry-task
            condition:
              type: completed
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
