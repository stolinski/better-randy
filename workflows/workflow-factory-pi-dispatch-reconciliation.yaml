id: 8b574012-78c2-4ae4-8744-a19e7dd9e742
name: factory-pi-dispatch-reconciliation
description: Reconcile one durable Supers Pi dispatch outbox entry against the exact Factory journal and fixed Pi runtime artifacts without submitting work.
tags:
  purpose: factory-pi-transport-reconciliation
inputs:
  type: object
  required: [dispatchToken]
  additionalProperties: false
  properties:
    dispatchToken:
      type: string
      pattern: '^[0-9a-f]{64}$'
jobs:
  - name: main
    description: Read-only reconciliation; submission remains exclusively owned by the fleet driver.
    steps:
      - name: reconcile-pi-dispatch
        task:
          type: model_method
          modelIdOrName: supers-delivery-profile
          methodName: reconcile_pi_dispatch
          inputs:
            dispatchToken: '${{ inputs.dispatchToken }}'
        dependsOn: []
        weight: 0
    dependsOn: []
    weight: 0
version: 1
