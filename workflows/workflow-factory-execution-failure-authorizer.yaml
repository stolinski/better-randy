id: c12c47db-abae-441b-b8b9-1c31b885cc51
name: factory-execution-failure-authorizer
description: Re-read a durable failure produced by the profile model's actual execution boundary and copy it into the current Factory stage.
tags:
  purpose: factory-operational-failure-authority
inputs:
  type: object
  additionalProperties: false
  required:
  - receiptName
  - sourceFactoryId
  - workItem
  - stage
  - stageCycle
  - dispatchAttempt
  - dispatchRunId
  properties:
    receiptName: { type: string, pattern: '^factory-execution-failure-[0-9a-f]{64}$' }
    sourceFactoryId: { type: string, minLength: 1 }
    workItem: { type: string, minLength: 1 }
    stage: { type: string, minLength: 1 }
    stageCycle: { type: integer, minimum: 1 }
    dispatchAttempt: { type: integer, minimum: 1 }
    dispatchRunId: { type: string, pattern: '^[0-9a-f]{64}$' }
jobs:
- name: main
  description: Verify exact current-dispatch identity in the trusted model, then record only its stored receipt.
  steps:
  - name: authorize-owned-failure
    task:
      type: model_method
      modelIdOrName: supers-delivery-profile
      methodName: authorize_execution_failure
      inputs:
        receiptName: ${{ inputs.receiptName }}
        sourceFactoryId: ${{ inputs.sourceFactoryId }}
        workItem: ${{ inputs.workItem }}
        stage: ${{ inputs.stage }}
        stageCycle: ${{ inputs.stageCycle }}
        dispatchAttempt: ${{ inputs.dispatchAttempt }}
        dispatchRunId: ${{ inputs.dispatchRunId }}
    dependsOn: []
    weight: 0
    allowFailure: false
  - name: record-authorized-failure
    task:
      type: model_method
      modelIdOrName: supers-delivery
      methodName: record_artifact
      inputs:
        workItem: ${{ inputs.workItem }}
        name: ${{ inputs.stage + '-execution-failure' }}
        payload: ${{ data.query('modelName == "supers-delivery-profile" && specName == "authorized-failure" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.stage == inputs.stage && record.attributes.stageCycle == inputs.stageCycle && record.attributes.dispatchAttempt == inputs.dispatchAttempt && record.attributes.dispatchRunId == inputs.dispatchRunId)[0].attributes }}
    dependsOn:
    - step: authorize-owned-failure
      condition: { type: succeeded }
    weight: 0
    allowFailure: false
  dependsOn: []
  weight: 0
version: 1
