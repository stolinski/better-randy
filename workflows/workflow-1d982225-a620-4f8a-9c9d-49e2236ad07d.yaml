id: 1d982225-a620-4f8a-9c9d-49e2236ad07d
name: supers-delivery-terminal-observability
description: Persist and verify the exact projected terminal supers-delivery outcome before the Factory finalizes it.
tags:
  purpose: automatic-factory-observability
  factory: supers-delivery
inputs:
  type: object
  required: [workItem, preterminalStage, targetStage, outcome, artifactName]
  additionalProperties: false
  properties:
    workItem: { type: string, minLength: 1 }
    preterminalStage:
      type: string
      enum: [done-observability, aborted-observability, escalated-observability]
    targetStage:
      type: string
      enum: [done, aborted, operational-escalation]
    outcome:
      type: string
      enum: [done, aborted, parked]
    artifactName:
      type: string
      enum:
        [
          done-terminal-observability,
          aborted-terminal-observability,
          escalated-terminal-observability
        ]
jobs:
  - name: main
    description: Project the exact terminal route, persist its receipt, and leave the Factory transition to finalize only after verification.
    steps:
      - name: persist-terminal-summary
        description: Persist the canonical exact projected terminal summary before finalization.
        task:
          type: model_method
          modelIdOrName: supers-factory-sentry-metrics
          methodName: persist_projected_summary
          inputs:
            workItem: ${{ inputs.workItem }}
            sourceFactory:
              id: 90fac686-c724-4aee-97c4-e31b9af4c5e2
              name: supers-delivery
            factory:
              project: better-randy
              name: supers-delivery
              profile: supers-dex-delivery
            visualReviewStages: [review]
            projectedTerminal:
              preterminalStage: ${{ inputs.preterminalStage }}
              targetStage: ${{ inputs.targetStage }}
              outcome: ${{ inputs.outcome }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: emit-terminal-flow-metrics
        description: Emit the explicitly projected terminal outcome tied to current preterminal Factory state.
        task:
          type: model_method
          modelIdOrName: supers-factory-sentry-metrics
          methodName: emit_flow_report
          inputs:
            workItem: ${{ inputs.workItem }}
            sourceFactory:
              id: 90fac686-c724-4aee-97c4-e31b9af4c5e2
              name: supers-delivery
            factory:
              project: better-randy
              name: supers-delivery
              profile: supers-dex-delivery
            visualReviewStages: [review]
            projectedTerminal:
              preterminalStage: ${{ inputs.preterminalStage }}
              targetStage: ${{ inputs.targetStage }}
              outcome: ${{ inputs.outcome }}
        dependsOn:
          - step: persist-terminal-summary
            condition: { type: completed }
        weight: 0
        allowFailure: true
      - name: verify-observability-coverage
        description: Require the exact projected outcome's complete local receipt before finalization without gating on Sentry availability or emission success.
        task:
          type: model_method
          modelIdOrName: supers-factory-sentry-metrics
          methodName: verify_flow_receipt
          inputs:
            workItem: ${{ inputs.workItem }}
            sourceFactory:
              id: 90fac686-c724-4aee-97c4-e31b9af4c5e2
              name: supers-delivery
            factory:
              project: better-randy
              name: supers-delivery
              profile: supers-dex-delivery
            visualReviewStages: [review]
            projectedTerminal:
              preterminalStage: ${{ inputs.preterminalStage }}
              targetStage: ${{ inputs.targetStage }}
              outcome: ${{ inputs.outcome }}
        dependsOn:
          - step: emit-terminal-flow-metrics
            condition: { type: completed }
        weight: 0
        allowFailure: false
      - name: record-terminal-observability
        description: Bind the exact projected summary and coverage receipt to this Factory work item and route.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: ${{ inputs.artifactName }}
            payload:
              schemaVersion: 1
              workItem: ${{ inputs.workItem }}
              preterminalStage: ${{ inputs.preterminalStage }}
              targetStage: ${{ inputs.targetStage }}
              outcome: ${{ inputs.outcome }}
              workflowRunId: ${{ run.id }}
        dependsOn:
          - step: verify-observability-coverage
            condition: { type: succeeded }
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 4
