id: 9c8b314e-4c8b-45fa-ad03-846539a64332
name: supers-sentry-repair-backlink
description: Add one idempotent Dex task backlink to a Sentry issue only after correlated human-approved Planning succeeds.
tags:
  purpose: supers-sentry-self-healing-backlink
  capability: approval-bound-sentry-mutation
inputs:
  type: object
  required: [planningWorkItem, repairIntentName]
  additionalProperties: false
  properties:
    planningWorkItem:
      type: string
      pattern: '^sentry-[A-Za-z0-9_-]{1,100}$'
    repairIntentName:
      type: string
      minLength: 1
jobs:
  - name: main
    description: Bind exact repair intent and Planning evidence before the Sentry comment mutation.
    steps:
      - name: record-sentry-backlink
        description: Post or confirm the exact Dex repair task backlink.
        task:
          type: model_method
          modelIdOrName: supers-sentry-repair-planning-handoff
          methodName: record-backlink
          inputs:
            repairIntent: '${{ data.latest("supers-sentry-repair-planning-handoff", inputs.repairIntentName).attributes }}'
            humanApproval: '${{ data.latest("supers-planning", "approval-" + inputs.planningWorkItem + "-planning-approval").attributes }}'
            application: '${{ data.latest("supers-planning", "artifact-" + inputs.planningWorkItem + "-plan-application").attributes.payload }}'
            planningAudit: '${{ data.latest("supers-planning", "artifact-" + inputs.planningWorkItem + "-planning-audit").attributes.payload }}'
            planningHandoff: '${{ data.latest("supers-planning", "artifact-" + inputs.planningWorkItem + "-planning-handoff").attributes.payload }}'
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
