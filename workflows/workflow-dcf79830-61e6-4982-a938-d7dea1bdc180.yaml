id: dcf79830-61e6-4982-a938-d7dea1bdc180
name: supers-planning-apply-approved-plan
description: Revalidate and apply the exact reviewed promotion bundle immediately after any required approval.
tags:
  purpose: supers-planning-factory
inputs:
  type: object
  properties:
    workItem:
      type: string
      minLength: 1
    planningInventory:
      type: object
      additionalProperties: true
    trackerInventory:
      type: object
      additionalProperties: true
    documentationEffects:
      type: object
      additionalProperties: true
    reviewedPlan:
      type: object
      additionalProperties: true
    applicationBundle:
      type: object
      additionalProperties: true
    applicationBundleValidation:
      type: object
      additionalProperties: true
    approvalGateId:
      type: string
      minLength: 1
  required:
    - workItem
    - planningInventory
    - trackerInventory
    - documentationEffects
    - reviewedPlan
    - applicationBundle
    - applicationBundleValidation
    - approvalGateId
  additionalProperties: false
jobs:
  - name: main
    description: Persist the reviewed boundary, revalidate it, and dispatch one exact recoverable promotion handler.
    steps:
      - name: revalidate-promotion-bundle
        description: Recheck the complete reviewed bundle and immutable evidence immediately before mutation.
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: validate-promotion-bundle
          inputs:
            workItem: ${{ inputs.workItem }}
            inventory: ${{ inputs.planningInventory }}
            trackerInventory: ${{ inputs.trackerInventory }}
            documentationEffects: ${{ inputs.documentationEffects }}
            reviewedPlan: ${{ inputs.reviewedPlan }}
            applicationBundle: ${{ inputs.applicationBundle }}
            sourceSnapshot: ${{ data.latest("repo-audit", inputs.planningInventory.sourceSnapshotName).attributes }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-approved-plan
        description: Persist the exact reviewed graph and route-correct approval disposition before applying effects.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: approved-plan
            payload:
              schemaVersion: 1
              plan: ${{ inputs.reviewedPlan }}
              planHash: ${{ inputs.applicationBundle.planHash }}
              proposalPlanHash: ${{ inputs.applicationBundle.planHash }}
              approvalGateId: ${{ inputs.approvalGateId }}
              summary: Exact reviewed application boundary persisted immediately before promotion.
        dependsOn:
          - step: revalidate-promotion-bundle
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: apply-promotion
        description: Dispatch the validated preview to its exact capture or graduation handler.
        task:
          type: model_method
          modelIdOrName: supers-planning-promotion
          methodName: apply-promotion
          inputs:
            preview: ${{ inputs.applicationBundle.payload }}
            validation: ${{ inputs.applicationBundleValidation }}
            approvalGateId: ${{ inputs.approvalGateId }}
            humanApproval: '${{ inputs.applicationBundle.approvalRequired ? data.latest("supers-planning", "approval-" + inputs.workItem + "-planning-approval").attributes : null }}'
        dependsOn:
          - step: record-approved-plan
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
      - name: normalize-promotion-application
        description: Normalize authority, cleanup, audit receipt, and optional Dex mappings on success or failure.
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: normalize-promotion-application
          inputs:
            workItem: ${{ inputs.workItem }}
            reviewedPlan: ${{ inputs.reviewedPlan }}
            applicationBundle: ${{ inputs.applicationBundle }}
            applicationBundleValidation: ${{ inputs.applicationBundleValidation }}
            promotionResult: '${{ size(data.query(''modelName == "supers-planning-promotion" && specName == "promotion-result" && workflowRunId == "'' + run.id + ''"'')) == 0 ? null : data.query(''modelName == "supers-planning-promotion" && specName == "promotion-result" && workflowRunId == "'' + run.id + ''"'')[0].attributes }}'
            promotionResultDataName: '${{ size(data.query(''modelName == "supers-planning-promotion" && specName == "promotion-result" && workflowRunId == "'' + run.id + ''"'')) == 0 ? "" : data.query(''modelName == "supers-planning-promotion" && specName == "promotion-result" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            promotionReceipt: ${{ data.query('modelName == "supers-planning-promotion" && specName == "promotion-receipt" && workflowRunId == "' + run.id + '"')[0].attributes }}
            promotionReceiptDataName: ${{ data.query('modelName == "supers-planning-promotion" && specName == "promotion-receipt" && workflowRunId == "' + run.id + '"')[0].name }}
        dependsOn:
          - step: apply-promotion
            condition:
              type: completed
        weight: 0
        allowFailure: false
      - name: record-plan-application
        description: Record the normalized promotion application in the active Planning Factory.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: plan-application
            payload: ${{ data.query('modelName == "repo-audit" && specName == "promotion-application-normalized" && workflowRunId == "' + run.id + '"')[0].attributes }}
        dependsOn:
          - step: normalize-promotion-application
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: record-plan-apply-run
        description: Record correlated plan-apply-run workflow evidence.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: plan-apply-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              workflow: supers-planning-apply-approved-plan
        dependsOn:
          - step: record-plan-application
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 2
