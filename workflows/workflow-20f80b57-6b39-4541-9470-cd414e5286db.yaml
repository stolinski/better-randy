id: 20f80b57-6b39-4541-9470-cd414e5286db
name: supers-sentry-self-healing
description: Every six hours, admit the next eligible issue and drive the complete evidence-bound repair, verification, and exact-release resolution chain.
tags:
  purpose: supers-sentry-self-healing
  capability: scheduled-terminal-repair
trigger:
  schedule: '0 */6 * * *'
  inputs:
    lookbackDays: 7
    historyDays: 90
    limit: 100
    currentRelease: auto
inputs:
  type: object
  required: [lookbackDays, historyDays, limit]
  additionalProperties: false
  properties:
    lookbackDays:
      type: integer
      minimum: 1
      maximum: 30
    historyDays:
      type: integer
      minimum: 7
      maximum: 365
    limit:
      type: integer
      minimum: 1
      maximum: 100
    currentRelease:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '^[A-Za-z0-9@._:+-]+$'
jobs:
  - name: main
    description: Bind one current collection to official-Dex triage and durable superseding queue intents through workflow-correlated immutable data.
    steps:
      - name: collect-sentry-issues
        description: Store the bounded issue snapshot and current/recent/historical reconciliation.
        task:
          type: model_method
          modelIdOrName: supers-sentry-issue-intake
          methodName: collect
          inputs:
            lookbackDays: '${{ inputs.lookbackDays }}'
            historyDays: '${{ inputs.historyDays }}'
            limit: '${{ inputs.limit }}'
            currentRelease: '${{ inputs.currentRelease }}'
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: triage-against-dex
        description: Read official Dex once and bind the exact workflow-produced reconciliation by name and fingerprint.
        task:
          type: model_method
          modelIdOrName: supers-sentry-issue-intake
          methodName: triage
          inputs:
            sourceReconciliation: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].attributes.sourceFingerprint }}'
        dependsOn:
          - step: collect-sentry-issues
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: persist-actionable-sentry-queue
        description: Persist confirmed-repair and reproduction-required intents while retaining prior evidence for replay-safe supersession.
        task:
          type: model_method
          modelIdOrName: supers-sentry-repair-planning-handoff
          methodName: prepare
          inputs:
            sourceSnapshot: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "snapshot" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedSnapshotFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "snapshot" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
            sourceReconciliation: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedReconciliationFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
            sourceTriage: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "triage" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedTriageFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "triage" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
            issuePlans: []
            priorIntents: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "repair-intent"'').map(resource, resource.attributes) }}'
        dependsOn:
          - step: triage-against-dex
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-correlated-triage
        description: Require the terminal triage to preserve the exact current-run reconciliation fingerprint.
        task:
          type: assert
          expr: 'data.query(''modelName == "supers-sentry-issue-intake" && specName == "triage" && workflowRunId == "'' + run.id + ''"'')[0].attributes.sourceFingerprint == data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].attributes.sourceFingerprint'
          message: Sentry intake triage did not preserve the current workflow reconciliation fingerprint
          severity: high
        dependsOn:
          - step: persist-actionable-sentry-queue
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-correlated-queue
        description: Require the current queue handoff to bind the exact triage produced by this scheduled run.
        task:
          type: assert
          expr: 'data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "handoff" && workflowRunId == "'' + run.id + ''"'')[0].attributes.sourceTriageFingerprint == data.query(''modelName == "supers-sentry-issue-intake" && specName == "triage" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint'
          message: Sentry actionable queue did not preserve the current workflow triage fingerprint
          severity: high
        dependsOn:
          - step: persist-actionable-sentry-queue
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: refresh-delivery-state
        description: Materialize Delivery state for observability; active repairs never block admission of another evidence-bound work item.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: status
          inputs: {}
        dependsOn:
          - step: assert-correlated-queue
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: resume-active-sentry-repair
        description: Converge every previously admitted active Sentry Factory run before selecting more work.
        forEach:
          item: admission
          in: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission"'').filter(admission, size(data.query(''modelName == "supers-delivery" && name == "state-'' + admission.attributes.dexTaskId + ''"'')) > 0).filter(admission, data.latest("supers-delivery", "state-" + admission.attributes.dexTaskId).attributes.status == "active") }}'
        concurrency: 4
        task:
          type: workflow
          workflowIdOrName: supers-sentry-factory-driver
          inputs:
            workItem: '${{ self.admission.attributes.dexTaskId }}'
            evidenceName: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "defect-reproduction"'').filter(reproduction, reproduction.attributes.repairIdentityFingerprint == self.admission.attributes.repairIdentityFingerprint && reproduction.attributes.checkoutRevision == self.admission.attributes.checkoutRevision)[0].attributes.evidenceName }}'
            expectedEvidenceFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "defect-reproduction"'').filter(reproduction, reproduction.attributes.repairIdentityFingerprint == self.admission.attributes.repairIdentityFingerprint && reproduction.attributes.checkoutRevision == self.admission.attributes.checkoutRevision)[0].attributes.evidenceFingerprint }}'
            mappingName: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping"'').filter(mapping, mapping.attributes.taskId == self.admission.attributes.dexTaskId)[0].name }}'
            expectedMappingFingerprint: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping"'').filter(mapping, mapping.attributes.taskId == self.admission.attributes.dexTaskId)[0].attributes.fingerprint }}'
            admissionName: '${{ self.admission.name }}'
            expectedAdmissionFingerprint: '${{ self.admission.attributes.fingerprint }}'
        dependsOn:
          - step: refresh-delivery-state
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: select-one-sentry-repair
        description: Select at most one stable queue head without requiring a separate reproduction worker.
        task:
          type: model_method
          modelIdOrName: supers-sentry-repair-planning-handoff
          methodName: select-next
          inputs:
            repairIntents: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "repair-intent"'').map(resource, resource.attributes) }}'
            planningStates: []
            priorSelections: []
            admittedIntentFingerprints: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission"'').filter(admission, size(data.query(''modelName == "supers-delivery" && name == "state-'' + admission.attributes.dexTaskId + ''"'')) > 0).map(admission, admission.attributes.repairIntentFingerprint) }}'
            excludedIssueIds: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "defect-reproduction-rejection"'').filter(rejection, has(rejection.attributes.capabilityVersion) && rejection.attributes.capabilityVersion == 2).map(rejection, rejection.attributes.issueId) }}'
        dependsOn:
          - step: resume-active-sentry-repair
            condition:
              type: completed
        weight: 0
        allowFailure: false
      - name: admit-selected-sentry-repair
        description: Collect exact issue and Seer evidence, then immediately start one evidence-bound Dex and Delivery repair.
        task:
          type: workflow
          workflowIdOrName: supers-sentry-evidence-to-delivery
          inputs:
            repairIntentName: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "repair-intent"'').filter(resource, resource.attributes.fingerprint == data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].attributes.selectedIntentFingerprint)[0].name }}'
            expectedRepairIntentFingerprint: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].attributes.selectedIntentFingerprint }}'
            queueSelectionName: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedQueueSelectionFingerprint: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
        guard: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].attributes.status != "selected" }}'
        dependsOn:
          - step: select-one-sentry-repair
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 4
