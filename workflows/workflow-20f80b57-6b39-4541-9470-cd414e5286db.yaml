id: 20f80b57-6b39-4541-9470-cd414e5286db
name: supers-sentry-self-healing
description: Every six hours, admit observed Sentry errors, drive checked fixes, resolve completed issues, and allow later events to enter as regressions.
tags:
  purpose: supers-sentry-self-healing
  capability: scheduled-terminal-repair
trigger:
  schedule: '0 */6 * * *'
  inputs:
    lookbackDays: 7
    historyDays: 90
    limit: 100
    currentRelease: auto
inputs:
  type: object
  required: [lookbackDays, historyDays, limit]
  additionalProperties: false
  properties:
    lookbackDays:
      type: integer
      minimum: 1
      maximum: 30
    historyDays:
      type: integer
      minimum: 7
      maximum: 365
    limit:
      type: integer
      minimum: 1
      maximum: 100
    currentRelease:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '^[A-Za-z0-9@._:+-]+$'
jobs:
  - name: main
    description: Bind one current collection to official-Dex triage and durable superseding queue intents through workflow-correlated immutable data.
    steps:
      - name: reconcile-agent-worktrees
        description: Inventory all Sentry coding lanes and remove only final clean work already represented by the central revision.
        task:
          type: model_method
          modelIdOrName: supers-sentry-coding-agent
          methodName: reconcileSupersAgentWorktrees
          inputs:
            claimIds: '${{ data.query(''modelName == "supers-sentry-coding-agent" && specName == "supers-agent-worktree-claim"'').filter(claim, size(data.query(''modelName == "supers-sentry-coding-agent" && specName == "supers-agent-worktree-removal"'').filter(removal, removal.attributes.claimId == claim.attributes.claimId)) == 0).map(claim, claim.attributes.claimId) }}'
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: collect-sentry-issues
        description: Store the bounded issue snapshot and current/recent/historical reconciliation.
        task:
          type: model_method
          modelIdOrName: supers-sentry-issue-intake
          methodName: collect
          inputs:
            lookbackDays: '${{ inputs.lookbackDays }}'
            historyDays: '${{ inputs.historyDays }}'
            limit: '${{ inputs.limit }}'
            currentRelease: '${{ inputs.currentRelease }}'
        dependsOn:
          - step: reconcile-agent-worktrees
            condition:
              type: completed
        weight: 0
        allowFailure: false
      - name: triage-against-dex
        description: Read official Dex once and bind the exact workflow-produced reconciliation by name and fingerprint.
        task:
          type: model_method
          modelIdOrName: supers-sentry-issue-intake
          methodName: triage
          inputs:
            sourceReconciliation: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].attributes.sourceFingerprint }}'
        dependsOn:
          - step: collect-sentry-issues
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: persist-actionable-sentry-queue
        description: Persist observed-error repair intents while retaining prior evidence for replay-safe supersession.
        task:
          type: model_method
          modelIdOrName: supers-sentry-repair-planning-handoff
          methodName: prepare
          inputs:
            sourceSnapshot: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "snapshot" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedSnapshotFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "snapshot" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
            sourceReconciliation: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedReconciliationFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
            sourceTriage: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "triage" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedTriageFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "triage" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
            issuePlans: []
            priorIntents: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "repair-intent"'').map(resource, resource.attributes) }}'
        dependsOn:
          - step: triage-against-dex
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-correlated-triage
        description: Require the terminal triage to preserve the exact current-run reconciliation fingerprint.
        task:
          type: assert
          expr: 'data.query(''modelName == "supers-sentry-issue-intake" && specName == "triage" && workflowRunId == "'' + run.id + ''"'')[0].attributes.sourceFingerprint == data.query(''modelName == "supers-sentry-issue-intake" && specName == "reconciliation" && workflowRunId == "'' + run.id + ''"'')[0].attributes.sourceFingerprint'
          message: Sentry intake triage did not preserve the current workflow reconciliation fingerprint
          severity: high
        dependsOn:
          - step: persist-actionable-sentry-queue
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: assert-correlated-queue
        description: Require the current queue handoff to bind the exact triage produced by this scheduled run.
        task:
          type: assert
          expr: 'data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "handoff" && workflowRunId == "'' + run.id + ''"'')[0].attributes.sourceTriageFingerprint == data.query(''modelName == "supers-sentry-issue-intake" && specName == "triage" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint'
          message: Sentry actionable queue did not preserve the current workflow triage fingerprint
          severity: high
        dependsOn:
          - step: persist-actionable-sentry-queue
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: refresh-delivery-state
        description: Materialize Delivery state for observability; active repairs never block admission of another evidence-bound work item.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: status
          inputs: {}
        dependsOn:
          - step: assert-correlated-queue
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: resume-active-sentry-repair
        description: Converge every previously admitted active Sentry Factory run before selecting more work.
        forEach:
          item: activeAdmission
          in: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission"'').filter(admission, size(data.query(''modelName == "supers-delivery" && name == "state-'' + admission.attributes.dexTaskId + ''"'')) > 0).filter(admission, data.latest("supers-delivery", "state-" + admission.attributes.dexTaskId).attributes.status == "active").filter(admission, size(data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence"'').filter(evidence, evidence.attributes.repairIdentityFingerprint == admission.attributes.repairIdentityFingerprint && evidence.attributes.checkoutRevision == admission.attributes.checkoutRevision)) > 0).filter(admission, size(data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission"'').filter(other, other.attributes.dexTaskId == admission.attributes.dexTaskId && other.attributes.admittedAt > admission.attributes.admittedAt)) == 0) }}'
        concurrency: 1
        task:
          type: workflow
          workflowIdOrName: supers-sentry-factory-driver
          inputs:
            workItem: '${{ self.activeAdmission.attributes.dexTaskId }}'
            evidenceName: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence"'').filter(evidence, evidence.attributes.repairIdentityFingerprint == self.activeAdmission.attributes.repairIdentityFingerprint && evidence.attributes.checkoutRevision == self.activeAdmission.attributes.checkoutRevision)[0].name }}'
            expectedEvidenceFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence"'').filter(evidence, evidence.attributes.repairIdentityFingerprint == self.activeAdmission.attributes.repairIdentityFingerprint && evidence.attributes.checkoutRevision == self.activeAdmission.attributes.checkoutRevision)[0].attributes.fingerprint }}'
            mappingName: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping"'').filter(mapping, mapping.attributes.taskId == self.activeAdmission.attributes.dexTaskId && mapping.attributes.repairIdentityFingerprint == self.activeAdmission.attributes.repairIdentityFingerprint)[0].name }}'
            expectedMappingFingerprint: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "task-mapping"'').filter(mapping, mapping.attributes.taskId == self.activeAdmission.attributes.dexTaskId && mapping.attributes.repairIdentityFingerprint == self.activeAdmission.attributes.repairIdentityFingerprint)[0].attributes.fingerprint }}'
            admissionName: '${{ self.activeAdmission.name }}'
            expectedAdmissionFingerprint: '${{ self.activeAdmission.attributes.fingerprint }}'
        dependsOn:
          - step: refresh-delivery-state
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: resolve-completed-sentry-repair
        description: Resolve every terminal checked repair that still lacks a correlated Sentry resolution receipt.
        forEach:
          item: completedAdmission
          in: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission"'').filter(admission, size(data.query(''modelName == "supers-delivery" && name == "state-'' + admission.attributes.dexTaskId + ''"'')) > 0).filter(admission, data.latest("supers-delivery", "state-" + admission.attributes.dexTaskId).attributes.status == "terminal" && data.latest("supers-delivery", "state-" + admission.attributes.dexTaskId).attributes.stageId == "done").filter(admission, size(data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence"'').filter(evidence, evidence.attributes.repairIdentityFingerprint == admission.attributes.repairIdentityFingerprint)) > 0).filter(admission, size(data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "backlink-receipt"'').filter(receipt, receipt.attributes.issueId == admission.attributes.issueId && receipt.attributes.dexTaskId == admission.attributes.dexTaskId)) > 0).filter(admission, size(data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "resolution-receipt"'').filter(receipt, receipt.attributes.issueId == admission.attributes.issueId && receipt.attributes.dexTaskId == admission.attributes.dexTaskId)) == 0) }}'
        concurrency: 4
        task:
          type: workflow
          workflowIdOrName: supers-sentry-verified-resolution
          inputs:
            repairIntentName: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "repair-intent"'').filter(intent, intent.attributes.fingerprint == self.completedAdmission.attributes.repairIntentFingerprint)[0].name }}'
            backlinkReceiptName: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "backlink-receipt"'').filter(receipt, receipt.attributes.issueId == self.completedAdmission.attributes.issueId && receipt.attributes.dexTaskId == self.completedAdmission.attributes.dexTaskId)[0].name }}'
            evidenceName: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence"'').filter(evidence, evidence.attributes.repairIdentityFingerprint == self.completedAdmission.attributes.repairIdentityFingerprint)[0].name }}'
            expectedEvidenceFingerprint: '${{ data.query(''modelName == "supers-sentry-issue-intake" && specName == "repair-evidence"'').filter(evidence, evidence.attributes.repairIdentityFingerprint == self.completedAdmission.attributes.repairIdentityFingerprint)[0].attributes.fingerprint }}'
            dexTaskId: '${{ self.completedAdmission.attributes.dexTaskId }}'
        dependsOn:
          - step: refresh-delivery-state
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: select-one-sentry-repair
        description: Select at most one stable queue head directly from observed Sentry errors.
        task:
          type: model_method
          modelIdOrName: supers-sentry-repair-planning-handoff
          methodName: select-next
          inputs:
            repairIntents: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "repair-intent"'').map(resource, resource.attributes) }}'
            planningStates: []
            priorSelections: []
            admittedIntentFingerprints: '${{ data.query(''modelName == "supers-sentry-reproduction-transport" && specName == "delivery-admission"'').filter(admission, size(data.query(''modelName == "supers-delivery" && name == "state-'' + admission.attributes.dexTaskId + ''"'')) > 0).map(admission, admission.attributes.repairIntentFingerprint) }}'
            excludedIssueIds: []
        dependsOn:
          - step: refresh-delivery-state
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: admit-selected-sentry-repair
        description: Collect exact issue and Seer evidence, then immediately start one evidence-bound Dex and Delivery repair.
        task:
          type: workflow
          workflowIdOrName: supers-sentry-evidence-to-delivery
          inputs:
            repairIntentName: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "repair-intent"'').filter(resource, resource.attributes.fingerprint == data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].attributes.selectedIntentFingerprint)[0].name }}'
            expectedRepairIntentFingerprint: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].attributes.selectedIntentFingerprint }}'
            queueSelectionName: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].name }}'
            expectedQueueSelectionFingerprint: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].attributes.fingerprint }}'
        guard: '${{ data.query(''modelName == "supers-sentry-repair-planning-handoff" && specName == "queue-selection" && workflowRunId == "'' + run.id + ''"'')[0].attributes.status != "selected" }}'
        dependsOn:
          - step: select-one-sentry-repair
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 10
