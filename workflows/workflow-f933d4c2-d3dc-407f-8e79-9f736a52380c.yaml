id: f933d4c2-d3dc-407f-8e79-9f736a52380c
name: supers-planning-documentation-effects
description: Validate and record non-mutating Supers documentation effects.
tags:
  purpose: supers-planning-factory
inputs:
  type: object
  properties:
    workItem:
      type: string
      minLength: 1
    inventory:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        objective:
          type: string
          minLength: 1
        contextRefs:
          type: array
          items:
            type: object
            properties:
              kind:
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
              reference:
                type: string
                minLength: 1
              summary:
                type: string
                minLength: 1
            required:
              - kind
              - name
              - reference
              - summary
            additionalProperties: false
        unresolvedDecisions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              question:
                type: string
                minLength: 1
              reason:
                type: string
                minLength: 1
            required:
              - id
              - question
              - reason
            additionalProperties: false
        clarificationRequired:
          type: boolean
        sourceSnapshotName:
          type: string
          minLength: 1
        sourceSnapshotFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - schemaVersion
        - objective
        - contextRefs
        - unresolvedDecisions
        - clarificationRequired
        - sourceSnapshotName
        - sourceSnapshotFingerprint
        - fingerprint
      additionalProperties: false
    trackerInventory:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        relatedTasks:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                minLength: 1
              name:
                type: string
                minLength: 1
              status:
                type: string
                minLength: 1
              relationship:
                type: string
                minLength: 1
            required:
              - id
              - name
              - status
              - relationship
            additionalProperties: false
        duplicateRisk:
          type: boolean
        summary:
          type: string
          minLength: 1
        sourceSnapshotFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        planningInventoryFingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
        fingerprint:
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
        - schemaVersion
        - relatedTasks
        - duplicateRisk
        - summary
        - sourceSnapshotFingerprint
        - planningInventoryFingerprint
        - fingerprint
      additionalProperties: false
    intent:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        status:
          type: string
          enum:
            - ready
            - needs-clarification
            - parked
        objective:
          type: string
          minLength: 1
        outcome:
          type: string
          minLength: 1
        inScope:
          type: array
          minItems: 0
          items:
            type: string
            minLength: 1
        outOfScope:
          type: array
          minItems: 0
          items:
            type: string
            minLength: 1
        constraints:
          type: array
          minItems: 0
          items:
            type: string
            minLength: 1
        acceptanceCriteria:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        tasteDecisions:
          type: array
          minItems: 0
          items:
            type: string
            minLength: 1
        documentationDirectives:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              operation:
                type: string
                enum:
                  - create
                  - update
                  - retire
                  - no-change
              documentKind:
                type: string
                minLength: 1
              target:
                type: string
                minLength: 1
              rationale:
                type: string
                minLength: 1
            required:
              - operation
              - documentKind
              - target
              - rationale
            additionalProperties: false
        revision:
          type: integer
          minimum: 1
        summary:
          type: string
          minLength: 1
      required:
        - schemaVersion
        - status
        - objective
        - outcome
        - inScope
        - outOfScope
        - constraints
        - acceptanceCriteria
        - tasteDecisions
        - documentationDirectives
        - revision
        - summary
      additionalProperties: false
  required:
    - workItem
    - inventory
    - trackerInventory
    - intent
  additionalProperties: false
jobs:
  - name: main
    description: Validate and record non-mutating Supers documentation effects.
    steps:
      - name: propose-documentation-effects
        description: Validate documentation directives against the immutable source chain.
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: propose-documentation-effects
          inputs:
            workItem: ${{ inputs.workItem }}
            inventory: ${{ inputs.inventory }}
            trackerInventory: ${{ inputs.trackerInventory }}
            intent: ${{ inputs.intent }}
            sourceSnapshot: ${{ data.latest("repo-audit", inputs.inventory.sourceSnapshotName).attributes }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-documentation-effects
        description: Record exact documentation-effects output in the active Planning Factory.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: documentation-effects
            payload: ${{ data.query('modelName == "repo-audit" && specName == "documentation-effects" && workflowRunId == "' + run.id + '"')[0].attributes }}
        dependsOn:
          - step: propose-documentation-effects
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: record-documentation-policy-run
        description: Record correlated documentation-policy-run workflow evidence.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: documentation-policy-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              workflow: supers-planning-documentation-effects
        dependsOn:
          - step: record-documentation-effects
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
