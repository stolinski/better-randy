id: 5dfa5e46-8098-4cf3-8dae-75162e8a967a
name: factory-terminal-summary
description: Persist a terminal Factory summary and emit its bounded flow metrics without gating delivery.
tags:
  purpose: factory-terminal-observability
inputs:
  type: object
  required: [workItem]
  additionalProperties: false
  properties:
    workItem:
      type: string
      minLength: 1
jobs:
  - name: main
    description: Persist canonical reports first, then project the same terminal run into Sentry metrics.
    steps:
      - name: summarize-factory-run
        description: Generate the built-in work-item summary and canonical flow-metrics report.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: summary
          inputs:
            workItem: '${{ inputs.workItem }}'
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: emit-terminal-flow-metrics
        description: Emit only terminal facts; failures remain observable but never fail the summary workflow.
        task:
          type: model_method
          modelIdOrName: supers-factory-sentry-metrics
          methodName: emit_flow_report
          inputs:
            workItem: '${{ inputs.workItem }}'
            sourceFactory:
              id: 90fac686-c724-4aee-97c4-e31b9af4c5e2
              name: supers-delivery
            factory:
              project: better-randy
              name: supers-delivery
              profile: supers-dex-delivery
            visualReviewStages: [review]
        dependsOn:
          - step: summarize-factory-run
            condition:
              type: succeeded
        weight: 0
        allowFailure: true
        guard: >-
          ${{ data.query('modelName == "supers-delivery" && specName == "state" && attributes.workItem == "' + inputs.workItem + '" && attributes.status == "terminal"').size() != 1 }}
    dependsOn: []
    weight: 0
version: 1
