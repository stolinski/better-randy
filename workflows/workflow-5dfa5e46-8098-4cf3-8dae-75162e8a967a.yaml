id: 5dfa5e46-8098-4cf3-8dae-75162e8a967a
name: factory-terminal-summary
description: Recover a projected terminal Factory receipt without allowing summary or telemetry failures to gate recovery.
tags:
  purpose: factory-terminal-observability-recovery
inputs:
  type: object
  required: [workItem, preterminalStage, targetStage, outcome]
  additionalProperties: false
  properties:
    workItem:
      type: string
      minLength: 1
    preterminalStage:
      type: string
      enum: [done-observability, aborted-observability, escalated-observability]
    targetStage:
      type: string
      enum: [done, aborted, operational-escalation]
    outcome:
      type: string
      enum: [done, aborted, parked]
  oneOf:
    - properties:
        preterminalStage: { const: done-observability }
        targetStage: { const: done }
        outcome: { const: done }
    - properties:
        preterminalStage: { const: aborted-observability }
        targetStage: { const: aborted }
        outcome: { const: aborted }
    - properties:
        preterminalStage: { const: escalated-observability }
        targetStage: { const: operational-escalation }
        outcome: { const: parked }
jobs:
  - name: main
    description: Attempt canonical summary persistence first, then recover the exact projected terminal receipt as a non-gating side effect.
    steps:
      - name: summarize-factory-run
        description: Attempt the canonical exact projected terminal summary without blocking legacy receipt recovery.
        task:
          type: model_method
          modelIdOrName: supers-factory-sentry-metrics
          methodName: persist_projected_summary
          inputs:
            workItem: '${{ inputs.workItem }}'
            sourceFactory:
              id: 90fac686-c724-4aee-97c4-e31b9af4c5e2
              name: supers-delivery
            factory:
              project: better-randy
              name: supers-delivery
              profile: supers-dex-delivery
            visualReviewStages: [review]
            projectedTerminal:
              preterminalStage: '${{ inputs.preterminalStage }}'
              targetStage: '${{ inputs.targetStage }}'
              outcome: '${{ inputs.outcome }}'
        dependsOn: []
        weight: 0
        allowFailure: true
      - name: emit-terminal-flow-metrics
        description: Emit only the explicit projected terminal route; telemetry failures never fail recovery.
        task:
          type: model_method
          modelIdOrName: supers-factory-sentry-metrics
          methodName: emit_flow_report
          inputs:
            workItem: '${{ inputs.workItem }}'
            sourceFactory:
              id: 90fac686-c724-4aee-97c4-e31b9af4c5e2
              name: supers-delivery
            factory:
              project: better-randy
              name: supers-delivery
              profile: supers-dex-delivery
            visualReviewStages: [review]
            projectedTerminal:
              preterminalStage: '${{ inputs.preterminalStage }}'
              targetStage: '${{ inputs.targetStage }}'
              outcome: '${{ inputs.outcome }}'
        dependsOn:
          - step: summarize-factory-run
            condition:
              type: completed
        weight: 0
        allowFailure: true
    dependsOn: []
    weight: 0
version: 2
