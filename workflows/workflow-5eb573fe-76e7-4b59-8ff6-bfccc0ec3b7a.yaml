id: 5eb573fe-76e7-4b59-8ff6-bfccc0ec3b7a
name: policy-sweep
tags:
  purpose: factory-lifecycle-integrity
inputs:
  type: object
  properties:
    workItem:
      type: string
      pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
    routingWorkflowRunId:
      type: string
      pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
  additionalProperties: false
jobs:
  - name: main
    description: >-
      Bind the canonical Supers Delivery lifecycle workflow identity, current
      policy run, and current routing run. Domain-specific repository audits
      are selected separately from trusted changed paths.
    steps:
      - name: record-delivery-policy-sweep
        description: Bind the current lifecycle and workflow identities into one content-addressed execution.
        task:
          type: model_method
          modelIdOrName: supers-delivery-verification-router
          methodName: record-policy-sweep-execution
          inputs:
            schemaVersion: 2
            workItem: '${{ has(inputs.workItem) ? inputs.workItem : "standalone-policy-sweep" }}'
            routingWorkflowRunId: '${{ has(inputs.routingWorkflowRunId) ? inputs.routingWorkflowRunId : run.id }}'
            policyWorkflowId: 5eb573fe-76e7-4b59-8ff6-bfccc0ec3b7a
            policyWorkflowName: policy-sweep
            policyWorkflowVersion: 4
            policyWorkflowRunId: '${{ run.id }}'
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 4
