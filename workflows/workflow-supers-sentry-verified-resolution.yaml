id: 0546299f-94a0-4d4c-865e-3b7f9e4ec067
name: supers-sentry-verified-resolution
description: Resolve one observed Sentry issue after its integrated fix passes normal Delivery checks.
tags:
  purpose: supers-sentry-self-healing-resolution
  capability: checked-fix-sentry-mutation
inputs:
  type: object
  required:
    - repairIntentName
    - backlinkReceiptName
    - evidenceName
    - expectedEvidenceFingerprint
    - dexTaskId
  additionalProperties: false
  properties:
    repairIntentName:
      type: string
      minLength: 1
      maxLength: 220
    backlinkReceiptName:
      type: string
      minLength: 1
      maxLength: 220
    evidenceName:
      type: string
      minLength: 1
      maxLength: 220
    expectedEvidenceFingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
    dexTaskId:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,128}$'
jobs:
  - name: main
    description: Bind the original event to terminal passing Delivery and resolve the exact issue.
    steps:
      - name: resolve-fixed-sentry-issue
        description: Resolve after the linked fix is integrated and normal checks pass; no reproduction or silence window is required.
        task:
          type: model_method
          modelIdOrName: supers-sentry-repair-planning-handoff
          methodName: resolve-fixed
          inputs:
            repairIntentName: '${{ inputs.repairIntentName }}'
            expectedRepairIntentFingerprint: '${{ data.latest("supers-sentry-repair-planning-handoff", inputs.repairIntentName).attributes.fingerprint }}'
            backlinkReceiptName: '${{ inputs.backlinkReceiptName }}'
            expectedBacklinkReceiptFingerprint: '${{ data.latest("supers-sentry-repair-planning-handoff", inputs.backlinkReceiptName).attributes.fingerprint }}'
            evidenceName: '${{ inputs.evidenceName }}'
            expectedEvidenceFingerprint: '${{ inputs.expectedEvidenceFingerprint }}'
            dexTaskId: '${{ inputs.dexTaskId }}'
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 2
