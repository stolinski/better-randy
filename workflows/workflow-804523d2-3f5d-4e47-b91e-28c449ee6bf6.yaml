id: 804523d2-3f5d-4e47-b91e-28c449ee6bf6
name: factory-verification-fanout
description: Run repository policy and selected deterministic delivery verification lanes with concurrent lane execution.
version: 1
tags:
  purpose: factory-verification
inputs:
  type: object
  properties:
    workItem:
      type: string
      minLength: 1
    expectedFingerprint:
      type: string
      pattern: "^[0-9a-f]{64}$"
    lanes:
      type: array
      maxItems: 3
      uniqueItems: true
      items:
        type: string
        enum:
          - check
          - unit
          - structural
  required:
    - workItem
    - expectedFingerprint
    - lanes
  additionalProperties: false
jobs:
  - name: main
    description: Fail closed on tree drift, run canonical policy, and fan out independent deterministic lanes.
    dependsOn: []
    steps:
      - name: assert-change-state
        description: Reject verification when repository content changed after classification.
        dependsOn: []
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: assert-change-state
          inputs:
            expectedFingerprint: '${{ inputs.expectedFingerprint }}'
      - name: policy-sweep
        description: Run the canonical policy and corpus workflow.
        dependsOn:
          - step: assert-change-state
            condition:
              type: succeeded
        task:
          type: workflow
          workflowIdOrName: policy-sweep
      - name: deterministic-lanes
        description: Execute check, unit, and structural lanes concurrently in one model lock.
        dependsOn:
          - step: policy-sweep
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: run-verification-fanout
          inputs:
            workItem: '${{ inputs.workItem }}'
            expectedFingerprint: '${{ inputs.expectedFingerprint }}'
            lanes: '${{ inputs.lanes }}'
      - name: assert-deterministic-lanes-passed
        description: Fail the workflow while retaining every lane result for diagnosis.
        dependsOn:
          - step: deterministic-lanes
            condition:
              type: succeeded
        task:
          type: assert
          expr: 'data.query(''modelName == "repo-audit" && specName == "verification-fanout" && workflowRunId == "'' + run.id + ''"'').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.expectedFingerprint == inputs.expectedFingerprint)[0].attributes.passed == true'
          message: Deterministic verification failed — inspect the current workflow verification-fanout resource.
          severity: high
    weight: 0
