id: 05aa64da-60fe-42fc-b9fd-edb33de11d92
name: factory-classify-change
description: Classify trusted Git changes and record correlated Factory products.
tags:
  purpose: factory-change-classification
inputs:
  type: object
  required: [workItem]
  additionalProperties: false
  properties:
    workItem:
      type: string
      minLength: 1
jobs:
  - name: main
    description: Keep classification and both Factory writes in one correlated workflow run.
    steps:
      - name: classify-change
        description: Classify only the exact baseline, integrated revision, and paths from the verified integration receipt.
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: classify-change
          inputs:
            workItem: '${{ inputs.workItem }}'
            expectedBaselineRevision: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-change-summary").attributes.payload.integrationReceipt.targetBaselineRevision }}'
            expectedIntegratedRevision: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-change-summary").attributes.payload.integrationReceipt.integratedRevision }}'
            expectedChangedPaths: '${{ data.latest("supers-delivery", "artifact-" + inputs.workItem + "-change-summary").attributes.payload.integrationReceipt.changedPaths }}'
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-change-impact
        description: Record the exact repo-audit resource produced by this workflow run.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: record_artifact
          inputs:
            workItem: '${{ inputs.workItem }}'
            name: change-impact
            payload:
              audit: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.audit }}
              generatedAt: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.generatedAt }}
              source: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.source }}
              workItem: '${{ inputs.workItem }}'
              baselineHead: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.baselineHead }}
              treeFingerprint: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint }}
              changeFingerprint: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.treeFingerprint }}
              paths: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.paths }}
              classification: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.classification }}
              domains: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.domains }}
              unknownPaths: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.unknownPaths }}
              intentRouteDigest: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.intentRouteDigest }}
              surfaces: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.surfaces }}
              requiredHumanReviews: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.requiredHumanReviews }}
              lanes: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.lanes }}
              requiredLanes: >-
                ${{ data.query('modelName == "repo-audit" && specName == "change-impact" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem)[0].attributes.lanes }}
        dependsOn:
          - step: classify-change
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: record-classify-evidence
        description: Record classification evidence only after the artifact write succeeds.
        task:
          type: model_method
          modelIdOrName: supers-delivery
          methodName: record_evidence
          inputs:
            workItem: '${{ inputs.workItem }}'
            name: classify-run
            payload:
              status: succeeded
              runId: '${{ run.id }}'
              workflow: factory-classify-change
        dependsOn:
          - step: record-change-impact
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 5
