id: eaa42ac3-476c-4cc9-9a3d-156a702ffe05
name: supers-sentry-reproduction-transport-reservation
description: Acquire the Swamp-owned fenced transport lease and reserve one exact bounded Sentry reproduction request on a clean matching checkout.
tags:
  purpose: supers-sentry-self-healing-reproduction
  capability: transport-reservation
inputs:
  type: object
  required: [requestName, expectedRequestFingerprint]
  additionalProperties: false
  properties:
    requestName:
      type: string
      minLength: 1
      maxLength: 220
    expectedRequestFingerprint:
      type: string
      pattern: '^[0-9a-f]{64}$'
jobs:
  - name: main
    description: Fence one local driver and reserve immutable reproduction transport without launching Pi or mutating Dex.
    steps:
      - name: acquire-reproduction-transport-lease
        description: Acquire or renew the single Swamp-owned local reproduction transport lease.
        task:
          type: model_method
          modelIdOrName: supers-sentry-reproduction-transport
          methodName: acquire-lease
          inputs:
            ownerId: swamp-sentry-reproduction-scheduler
            ttlSeconds: 60
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: assert-exact-reproduction-request
        description: Reject a request name whose content fingerprint differs from the caller's expected identity.
        task:
          type: assert
          expr: 'data.latest("supers-sentry-reproduction-controller", inputs.requestName).attributes.fingerprint == inputs.expectedRequestFingerprint'
          message: Sentry reproduction request fingerprint mismatch
          severity: high
        dependsOn:
          - step: acquire-reproduction-transport-lease
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: reserve-reproduction-transport
        description: Reserve the exact closed request only when its revision is the clean central checkout.
        task:
          type: model_method
          modelIdOrName: supers-sentry-reproduction-transport
          methodName: reserve
          inputs:
            ownerId: swamp-sentry-reproduction-scheduler
            fencingToken: '${{ data.latest("supers-sentry-reproduction-transport", "sentry-reproduction-transport-lease").attributes.fencingToken }}'
            requestName: '${{ inputs.requestName }}'
            expectedRequestFingerprint: '${{ inputs.expectedRequestFingerprint }}'
        dependsOn:
          - step: assert-exact-reproduction-request
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 2
