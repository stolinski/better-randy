id: 5837b051-a547-4624-a26c-3dffc2e6b1f8
name: supers-planning-delivery-handoff
description: Atomically resume or claim one human-approved Dex ready leaf inside its approved root, then converge that Delivery Factory lane.
tags:
  purpose: supers-planning-delivery-handoff
inputs:
  type: object
  properties:
    planningWorkItem:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
  required:
  - planningWorkItem
  additionalProperties: false
jobs:
- name: main
  description: Validate Planning provenance, claim Dex ownership, and converge Delivery Factory state.
  steps:
  - name: refresh-delivery-fleet
    description: Materialize the current typed Delivery Factory fleet before root-scoped Dex selection.
    task:
      type: model_method
      modelIdOrName: supers-delivery
      methodName: status
      inputs: {}
    dependsOn: []
    weight: 0
    allowFailure: false
  - name: prepare-delivery-handoff
    description: Bind the current human approval, exact proposal, applied mappings, clean audit, and explicit epic boundary.
    task:
      type: model_method
      modelIdOrName: supers-delivery-handoff-authorizer
      methodName: prepare-delivery-handoff
      inputs:
        planningWorkItem: ${{ inputs.planningWorkItem }}
        proposalCycle: ${{ data.latest("supers-planning", "artifact-" + inputs.planningWorkItem + "-dex-graph-proposal").attributes.cycle }}
        graphProposal: ${{ data.latest("supers-planning", "artifact-" + inputs.planningWorkItem + "-dex-graph-proposal").attributes.payload }}
        approvedPlan: ${{ data.latest("supers-planning", "artifact-" + inputs.planningWorkItem + "-approved-plan").attributes.payload }}
        humanApproval: ${{ data.latest("supers-planning", "approval-" + inputs.planningWorkItem + "-planning-approval").attributes }}
        application: ${{ data.latest("supers-planning", "artifact-" + inputs.planningWorkItem + "-plan-application").attributes.payload }}
        planningAudit: ${{ data.latest("supers-planning", "artifact-" + inputs.planningWorkItem + "-planning-audit").attributes.payload }}
        planningHandoff: ${{ data.latest("supers-planning", "artifact-" + inputs.planningWorkItem + "-planning-handoff").attributes.payload }}
    dependsOn: []
    weight: 0
    allowFailure: false
  - name: claim-next-ready
    description: Under the Dex repository lock, resume ownership or start the unique approved ready leaf inside this root epic.
    task:
      type: model_method
      modelIdOrName: supers-dex-delivery-handoff-authorized
      methodName: claim-next-ready
      inputs:
        authorizationCapability: ${{ vault.get(supers-planning-delivery-handoff, AUTHORIZATION_KEY) }}
        approval: ${{ data.query('modelName == "supers-delivery-handoff-authorizer" && specName == "delivery-handoff-approval" && workflowRunId == "' + run.id + '"')[0].attributes }}
        activeFactoryWorkItems: ${{ data.query('modelName == "supers-delivery" && specName == "status" && name == "status-_factory" && workflowRunId == "' + run.id + '"')[0].attributes.runs.filter(factoryRun, factoryRun.status == "active").map(factoryRun, factoryRun.workItem) }}
    dependsOn:
    - step: prepare-delivery-handoff
      condition:
        type: succeeded
    - step: refresh-delivery-fleet
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
  - name: start-delivery-factory
    description: Start Factory state for a newly claimed or recovered Dex task; duplicate starts may fail while convergence still succeeds.
    task:
      type: model_method
      modelIdOrName: supers-delivery
      methodName: start
      inputs:
        workItem: ${{ data.query('modelName == "supers-dex-delivery-handoff-authorized" && specName == "ready-leaf-claim" && workflowRunId == "' + run.id + '"')[0].attributes.selectedTaskId }}
    dependsOn:
    - step: claim-next-ready
      condition:
        type: succeeded
    weight: 0
    allowFailure: true
    guard: ${{ data.query('modelName == "supers-dex-delivery-handoff-authorized" && specName == "ready-leaf-claim" && workflowRunId == "' + run.id + '"')[0].attributes.status != "claimed" }}
  - name: normalize-claimed-delivery-handoff
    description: Require claimed or resumed ownership in this approved root to converge to at most one active Factory state.
    task:
      type: model_method
      modelIdOrName: supers-delivery-handoff-authorizer
      methodName: normalize-delivery-handoff
      inputs:
        approval: ${{ data.query('modelName == "supers-delivery-handoff-authorizer" && specName == "delivery-handoff-approval" && workflowRunId == "' + run.id + '"')[0].attributes }}
        claim: ${{ data.query('modelName == "supers-dex-delivery-handoff-authorized" && specName == "ready-leaf-claim" && workflowRunId == "' + run.id + '"')[0].attributes }}
        factoryStates: ${{ data.query('modelName == "supers-delivery" && specName == "state" && attributes.workItem == "' + data.query('modelName == "supers-dex-delivery-handoff-authorized" && specName == "ready-leaf-claim" && workflowRunId == "' + run.id + '"')[0].attributes.selectedTaskId + '"').map(record, record.attributes) }}
    dependsOn:
    - step: start-delivery-factory
      condition:
        type: completed
    weight: 0
    allowFailure: false
    guard: ${{ data.query('modelName == "supers-dex-delivery-handoff-authorized" && specName == "ready-leaf-claim" && workflowRunId == "' + run.id + '"')[0].attributes.status != "claimed" && data.query('modelName == "supers-dex-delivery-handoff-authorized" && specName == "ready-leaf-claim" && workflowRunId == "' + run.id + '"')[0].attributes.status != "resumed" }}
  - name: normalize-terminal-delivery-handoff
    description: Normalize no-work and human-gate claims without attempting to start Delivery.
    task:
      type: model_method
      modelIdOrName: supers-delivery-handoff-authorizer
      methodName: normalize-delivery-handoff
      inputs:
        approval: ${{ data.query('modelName == "supers-delivery-handoff-authorizer" && specName == "delivery-handoff-approval" && workflowRunId == "' + run.id + '"')[0].attributes }}
        claim: ${{ data.query('modelName == "supers-dex-delivery-handoff-authorized" && specName == "ready-leaf-claim" && workflowRunId == "' + run.id + '"')[0].attributes }}
        factoryStates: []
    dependsOn:
    - step: claim-next-ready
      condition:
        type: succeeded
    weight: 0
    allowFailure: false
    guard: ${{ data.query('modelName == "supers-dex-delivery-handoff-authorized" && specName == "ready-leaf-claim" && workflowRunId == "' + run.id + '"')[0].attributes.status == "claimed" || data.query('modelName == "supers-dex-delivery-handoff-authorized" && specName == "ready-leaf-claim" && workflowRunId == "' + run.id + '"')[0].attributes.status == "resumed" }}
  dependsOn: []
  weight: 0
version: 1
