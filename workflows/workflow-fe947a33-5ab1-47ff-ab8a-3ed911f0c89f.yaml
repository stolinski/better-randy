id: fe947a33-5ab1-47ff-ab8a-3ed911f0c89f
name: supers-planning-terminal-observability
description: Finalize one supers-planning run, persist its canonical summary, and emit non-gating Factory observability.
tags:
  purpose: automatic-factory-observability
  factory: supers-planning
inputs:
  type: object
  required:
  - workItem
  additionalProperties: false
  properties:
    workItem:
      type: string
      minLength: 1
jobs:
- name: main
  description: Make the Factory terminal first, then derive reports and observability from the durable terminal journal.
  steps:
  - name: finalize-terminal-state
    description: Advance into the durable terminal state; tolerate an already-terminal replay so receipt recovery remains possible.
    task:
      type: model_method
      modelIdOrName: supers-planning
      methodName: advance
      inputs:
        workItem: ${{ inputs.workItem }}
        transition: finalize
    dependsOn: []
    weight: 0
    allowFailure: true
  - name: persist-terminal-summary
    description: Persist the built-in and canonical flow-metrics reports from the terminal journal.
    task:
      type: model_method
      modelIdOrName: supers-planning
      methodName: summary
      inputs:
        workItem: ${{ inputs.workItem }}
    dependsOn:
    - step: finalize-terminal-state
      condition:
        type: completed
    weight: 0
    allowFailure: true
  - name: emit-terminal-flow-metrics
    description: Emit bounded effectiveness and profiling metrics; Sentry failure cannot change Factory outcome.
    task:
      type: model_method
      modelIdOrName: supers-factory-sentry-metrics
      methodName: emit_flow_report
      inputs:
        workItem: ${{ inputs.workItem }}
        sourceFactory:
          id: d5f581ad-2c79-41c4-829f-ced1ae9331cc
          name: supers-planning
        factory:
          project: better-randy
          name: supers-planning
          profile: supers-planning
        visualReviewStages:
        - plan-review
    dependsOn:
    - step: finalize-terminal-state
      condition:
        type: completed
    weight: 0
    allowFailure: true
  - name: verify-observability-coverage
    description: Fail the observer workflow when the terminal run lacks an emitted or duplicate local receipt.
    task:
      type: model_method
      modelIdOrName: supers-factory-sentry-metrics
      methodName: verify_flow_receipt
      inputs:
        workItem: ${{ inputs.workItem }}
        sourceFactory:
          id: d5f581ad-2c79-41c4-829f-ced1ae9331cc
          name: supers-planning
        factory:
          project: better-randy
          name: supers-planning
          profile: supers-planning
        visualReviewStages:
        - plan-review
    dependsOn:
    - step: emit-terminal-flow-metrics
      condition:
        type: completed
    weight: 0
    allowFailure: false
  dependsOn: []
  weight: 0
version: 1
