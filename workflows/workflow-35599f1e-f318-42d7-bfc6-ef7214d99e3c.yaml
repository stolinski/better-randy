id: 35599f1e-f318-42d7-bfc6-ef7214d99e3c
name: supers-planning-inventory
description: Collect and record deterministic Supers planning inventory.
tags:
  purpose: supers-planning-factory
inputs:
  type: object
  properties:
    workItem:
      type: string
      minLength: 1
  required:
    - workItem
  additionalProperties: false
jobs:
  - name: main
    description: Collect and record deterministic Supers planning inventory.
    steps:
      - name: collect-planning-inventory
        description: Collect one immutable Supers planning and Dex snapshot.
        task:
          type: model_method
          modelIdOrName: repo-audit
          methodName: collect-planning-inventory
          inputs:
            workItem: ${{ inputs.workItem }}
            planningState:
              dataReference: swamp:data/repo-audit/planning-latest
              generatedAt: ${{ data.latest("repo-audit", "planning-latest").attributes.generatedAt }}
              clean: ${{ data.latest("repo-audit", "planning-latest").attributes.clean }}
              runway:
                activeTaskId: '${{ data.latest("repo-audit", "planning-latest").attributes.runway.activeTaskId == null ? "" : data.latest("repo-audit", "planning-latest").attributes.runway.activeTaskId }}'
                activeTaskName: '${{ data.latest("repo-audit", "planning-latest").attributes.runway.activeTaskName == null ? "" : data.latest("repo-audit", "planning-latest").attributes.runway.activeTaskName }}'
                activeEpicId: '${{ data.latest("repo-audit", "planning-latest").attributes.runway.activeEpicId == null ? "" : data.latest("repo-audit", "planning-latest").attributes.runway.activeEpicId }}'
                nextTaskId: '${{ data.latest("repo-audit", "planning-latest").attributes.runway.nextTaskId == null ? "" : data.latest("repo-audit", "planning-latest").attributes.runway.nextTaskId }}'
                nextTaskName: '${{ data.latest("repo-audit", "planning-latest").attributes.runway.nextTaskName == null ? "" : data.latest("repo-audit", "planning-latest").attributes.runway.nextTaskName }}'
                topPriority: '${{ data.latest("repo-audit", "planning-latest").attributes.runway.topPriority == null ? -1 : data.latest("repo-audit", "planning-latest").attributes.runway.topPriority }}'
                readyLeafCount: '${{ data.latest("repo-audit", "planning-latest").attributes.runway.readyLeafCount == null ? 0 : data.latest("repo-audit", "planning-latest").attributes.runway.readyLeafCount }}'
            unresolvedDecisions: []
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-planning-inventory
        description: Record exact planning-inventory output in the active Planning Factory.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: planning-inventory
            payload: ${{ data.query('modelName == "repo-audit" && specName == "planning-inventory" && workflowRunId == "' + run.id + '"')[0].attributes }}
        dependsOn:
          - step: collect-planning-inventory
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
      - name: record-inventory-run
        description: Record correlated inventory-run workflow evidence.
        task:
          type: model_method
          modelIdOrName: supers-planning
          methodName: record_evidence
          inputs:
            workItem: ${{ inputs.workItem }}
            name: inventory-run
            payload:
              status: succeeded
              runId: ${{ run.id }}
              workflow: supers-planning-inventory
        dependsOn:
          - step: record-planning-inventory
            condition:
              type: succeeded
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
