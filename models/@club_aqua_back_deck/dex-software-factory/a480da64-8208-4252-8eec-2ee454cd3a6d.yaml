---
type: '@club_aqua_back_deck/dex-software-factory'
typeVersion: 2026.08.26.1
id: a480da64-8208-4252-8eec-2ee454cd3a6d
name: supers-delivery-profile
version: 2
tags: {}
globalArguments:
  profileName: supers-dex-delivery
  profileModelName: supers-delivery-profile
  sourceFactoryId: 90fac686-c724-4aee-97c4-e31b9af4c5e2
  adapters:
    failureAuthorizer:
      workflow: factory-execution-failure-authorizer
    preflight:
      mode: workflow
      workflow: factory-policy-sweep
      inputs:
        values:
          evidenceName: preflight-run
        properties:
          evidenceName:
            type: string
            enum:
              - preflight-run
        required:
          - evidenceName
    classify:
      mode: workflow
      workflow: factory-classify-change
    verification:
      mode: workflow
      workflow: supers-delivery-deterministic-verification
    postflight:
      mode: workflow
      workflow: factory-postflight-sweep
      inputs:
        values:
          evidenceName: postflight-run
        properties:
          evidenceName:
            type: string
            enum:
              - postflight-run
        required:
          - evidenceName
    terminalObserver:
      workflow: supers-delivery-terminal-observability
    dexTracker:
      modelIdOrName: supers-dex-task-tracker
      completeMethodName: complete
      completionWorkflow: supers-complete-human-approved-task
  implementation:
    skills:
      - supers-domain-aware-implementation
    constraints: .claude/skills/supers-domain-aware-implementation/SKILL.md
    systemPrompt: Implement only the current Dex work item in the Pi-managed isolated
      worktree. Follow repository guidance already loaded by the agent. Complete required
      source, documentation, and tracker-file edits, commit the lane, and return the
      strict child revision plus durable handoff manifest path. Load the exact union
      of skills and constraints from the schema-validated preflight work-domain route;
      never infer routing from agent prose. The central parent must verify and integrate
      that handoff while this work item remains in implementation.
      Only after serialized integration may the parent record change-summary with
      the digest-verified, content-addressed integrationReceipt.
  completionGate:
    id: completion-approval
  machineCompletion:
    artifact: sentry-machine-authorization
    completionWorkflow: supers-complete-authorized-task
  contracts:
    changeSummary:
      properties:
        commit:
          type: string
          minLength: 7
        integrationReceipt:
          type: object
          additionalProperties: false
          required:
            - schemaVersion
            - receiptId
            - rootEpicId
            - activeTaskId
            - factoryName
            - handoffManifestDigest
            - targetBaselineRevision
            - childRevisionEvidence
            - disposition
            - baseCommit
            - patchDigest
            - changedPaths
            - integratedRevision
            - integratedTreeFingerprint
            - rejectionReason
          properties:
            schemaVersion:
              type: integer
              enum:
                - 1
            receiptId:
              type: string
              pattern: '^[0-9a-f]{64}$'
            rootEpicId:
              type: string
              pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
            activeTaskId:
              type: string
              pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
            factoryName:
              type: string
              enum:
                - supers-delivery
            handoffManifestDigest:
              type: string
              pattern: '^[0-9a-f]{64}$'
            targetBaselineRevision:
              type: string
              pattern: '^[0-9a-f]{40,64}$'
            childRevisionEvidence:
              type: object
              additionalProperties: false
              required:
                - status
                - childCommittedRevision
              properties:
                status:
                  type: string
                  enum:
                    - verified
                childCommittedRevision:
                  type: string
                  pattern: '^[0-9a-f]{40,64}$'
            disposition:
              type: string
              enum:
                - integrated
            baseCommit:
              type: string
              pattern: '^[0-9a-f]{40,64}$'
            patchDigest:
              type: string
              pattern: '^[0-9a-f]{64}$'
            changedPaths:
              type: array
              minItems: 1
              items:
                type: string
                minLength: 1
            integratedRevision:
              type: string
              pattern: '^[0-9a-f]{40,64}$'
            integratedTreeFingerprint:
              type: string
              pattern: '^[0-9a-f]{64}$'
            rejectionReason:
              type: string
              enum:
                - none
      required:
        - integrationReceipt
    changeImpact:
      properties:
        audit:
          type: string
          enum:
            - change-impact
        generatedAt:
          type: string
        source:
          type: string
          enum:
            - git-baseline-and-working-tree
        workItem:
          type: string
          minLength: 1
        baselineHead:
          type: string
          pattern: '^[0-9a-f]{40,64}$'
        treeFingerprint:
          type: string
          pattern: '^[0-9a-f]{64}$'
        paths:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: string
            minLength: 1
        classification:
          type: string
          enum:
            - known
            - mixed
            - unknown
        domains:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - reasons
            properties:
              id:
                type: string
                enum:
                  - preset
                  - pack
                  - authoring-app
                  - rendering
                  - export
                  - performance
                  - repository-infrastructure
                  - swamp-control-plane
                  - documentation-planning
                  - unknown
              reasons:
                type: array
                minItems: 1
                items:
                  type: string
        unknownPaths:
          type: array
          items:
            type: string
        intentRouteDigest:
          type: string
          pattern: '^[0-9a-f]{64}$'
        surfaces:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - reasons
            properties:
              id:
                type: string
                enum:
                  - authoring-app
                  - rendered-composition
                  - export-pipeline
                  - control-plane
              reasons:
                type: array
                minItems: 1
                items:
                  type: string
        requiredHumanReviews:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - kind
              - reasons
            properties:
              kind:
                type: string
                enum:
                  - authoring-app-visual
                  - rendered-composition-aesthetic
              reasons:
                type: array
                minItems: 1
                items:
                  type: string
        lanes:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - id
              - reasons
            properties:
              id:
                type: string
              reasons:
                type: array
                minItems: 1
                items:
                  type: string
      required:
        - audit
        - generatedAt
        - source
        - workItem
        - baselineHead
        - treeFingerprint
        - paths
        - classification
        - domains
        - unknownPaths
        - intentRouteDigest
        - surfaces
        - requiredHumanReviews
        - lanes
    reconciliation:
      properties:
        dexDisposition:
          type: string
          enum:
            - ready-for-completion
      required:
        - dexDisposition
  verificationRouting:
    mode: closed-objective
    unavailableStage: evidence-unavailable
    aestheticGateId: aesthetic-acceptance
    aestheticDecisionAdapter:
      mode: workflow
      workflow: supers-bind-human-aesthetic-decision
  budgets:
    implementation: 5
    verification: 5
    review: 5
    reconciliation: 5
    maxDispatchesPerCycle: 1
methods: {}
