                    - rendered-composition-aesthetic
              disposition:
                type: string
                enum:
                  - automatic-rework
                  - evidence-unavailable
                  - await-human-aesthetic
                  - reconcile
              objectiveFailureCodes:
                type: array
                items:
                  type: string
                  minLength: 1
              unavailableEvidenceCodes:
                type: array
                items:
                  type: string
                  minLength: 1
              advisories:
                type: array
                items:
                  type: object
        - name: verification-execution-failure
          description: >-
            Content-addressed operational failure generated from an actual execution receipt for the
            current dispatch.
          schema:
            type: object
            additionalProperties: false
            required:
              - schemaVersion
              - receiptDigest
              - sourceFactoryId
              - workItem
              - stage
              - stageCycle
              - dispatchAttempt
              - dispatchRunId
              - failureKind
              - category
              - executionReceipt
              - retryable
              - error
              - occurredAt
              - authorityWorkflow
              - authorityReceiptName
              - authorityDigest
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 5
              receiptDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              sourceFactoryId:
                type: string
                enum:
                  - 90fac686-c724-4aee-97c4-e31b9af4c5e2
              workItem:
                type: string
                minLength: 1
              stage:
                type: string
                enum:
                  - verification
              stageCycle:
                type: integer
                minimum: 1
              dispatchAttempt:
                type: integer
                minimum: 1
              dispatchRunId:
                type: string
                pattern: '^[0-9a-f]{64}$'
              failureKind:
                type: string
                enum:
                  - operational
              category:
                type: string
                enum:
                  - prerequisite
                  - tool-unavailable
                  - workflow-failed
                  - method-failed
              executionReceipt:
                type: object
                additionalProperties: false
                required:
                  - kind
                  - receiptId
                  - status
                properties:
                  kind:
                    type: string
                    enum:
                      - workflow
                      - command
                  receiptId:
                    type: string
                    minLength: 1
                  status:
                    type: string
                    enum:
                      - failed
                  workflowName:
                    type: string
                    minLength: 1
                  workflowRunId:
                    type: string
                    minLength: 1
                  inputsDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  operation:
                    type: string
                    minLength: 1
                  command:
                    type: string
                    minLength: 1
                  exitCode:
                    type: integer
                  stdoutDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  stderrDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
              retryable:
                type: boolean
              error:
                type: string
                minLength: 1
                maxLength: 2000
              occurredAt:
                type: string
                minLength: 1
              authorityWorkflow:
                type: string
                enum:
                  - factory-execution-failure-authorizer
              authorityReceiptName:
                type: string
                pattern: '^factory-execution-failure-[A-Za-z0-9._:-]+$'
              authorityDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
      transitions:
        - name: automatic-rework
          to: implementation
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-delivery-deterministic-verification
                requireStepOutputs:
                  - artifact-verification
                  - evidence-verification-run
            - type: artifact-fresh
              config:
                artifact: verification
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.verification.workItem == workItem &&
                  artifacts.verification.integratedRevision ==
                  artifacts.change_summary.integrationReceipt.integratedRevision &&
                  artifacts.verification.integratedTreeFingerprint ==
                  artifacts.change_summary.integrationReceipt.integratedTreeFingerprint &&
                  artifacts.verification.treeFingerprint ==
                  artifacts.change_impact.changeFingerprint && artifacts.verification.disposition ==
                  "automatic-rework" && size(artifacts.verification.objectiveFailureCodes) > 0 &&
                  size(artifacts.verification.unavailableEvidenceCodes) == 0
                message: automatic rework requires fresh complete closed objective failure evidence
        - name: evidence-unavailable
          to: evidence-unavailable
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-delivery-deterministic-verification
                requireStepOutputs:
                  - artifact-verification
                  - evidence-verification-run
            - type: artifact-fresh
              config:
                artifact: verification
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.verification.workItem == workItem &&
                  artifacts.verification.integratedRevision ==
                  artifacts.change_summary.integrationReceipt.integratedRevision &&
                  artifacts.verification.integratedTreeFingerprint ==
                  artifacts.change_summary.integrationReceipt.integratedTreeFingerprint &&
                  artifacts.verification.treeFingerprint ==
                  artifacts.change_impact.changeFingerprint && artifacts.verification.disposition ==
                  "evidence-unavailable" && size(artifacts.verification.unavailableEvidenceCodes) >
                  0
                message: unavailable evidence pauses Delivery without authorizing mutation
        - name: await-human-aesthetic
          to: aesthetic-approval
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-delivery-deterministic-verification
                requireStepOutputs:
                  - artifact-verification
                  - evidence-verification-run
            - type: artifact-fresh
              config:
                artifact: verification
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.verification.workItem == workItem &&
                  artifacts.verification.integratedRevision ==
                  artifacts.change_summary.integrationReceipt.integratedRevision &&
                  artifacts.verification.integratedTreeFingerprint ==
                  artifacts.change_summary.integrationReceipt.integratedTreeFingerprint &&
                  artifacts.verification.treeFingerprint ==
                  artifacts.change_impact.changeFingerprint && artifacts.verification.disposition ==
                  "await-human-aesthetic" && size(artifacts.verification.objectiveFailureCodes) == 0
                  && size(artifacts.verification.unavailableEvidenceCodes) == 0 &&
                  artifacts.verification.renderMatrixManifestDigest.matches("^[0-9a-f]{64}$") &&
                  artifacts.verification.renderMatrixBundleDigest.matches("^[0-9a-f]{64}$") &&
                  artifacts.verification.renderMatrixRunDigest.matches("^[0-9a-f]{64}$") &&
                  artifacts.verification.renderEvidenceArchiveDigest.matches("^[0-9a-f]{64}$")
                message: aesthetic review requires a complete passing exact render bundle
        - name: reconcile
          to: reconciliation
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-delivery-deterministic-verification
                requireStepOutputs:
                  - artifact-verification
                  - evidence-verification-run
            - type: artifact-fresh
              config:
                artifact: verification
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.verification.workItem == workItem &&
                  artifacts.verification.integratedRevision ==
                  artifacts.change_summary.integrationReceipt.integratedRevision &&
                  artifacts.verification.integratedTreeFingerprint ==
                  artifacts.change_summary.integrationReceipt.integratedTreeFingerprint &&
                  artifacts.verification.treeFingerprint ==
                  artifacts.change_impact.changeFingerprint && artifacts.verification.disposition ==
                  "reconcile" && size(artifacts.verification.objectiveFailureCodes) == 0 &&
                  size(artifacts.verification.unavailableEvidenceCodes) == 0
                message: >-
                  reconciliation requires complete passing objective evidence and proven render
                  non-applicability
        - name: operational-pause
          to: verification-recovery
          gates:
            - type: artifact-exists
              config:
                artifact: verification-execution-failure
            - type: cel
              config:
                expr: >-
                  artifacts.verification_execution_failure.sourceFactoryId ==
                  "90fac686-c724-4aee-97c4-e31b9af4c5e2" &&
                  artifacts.verification_execution_failure.workItem == workItem &&
                  artifacts.verification_execution_failure.stage == "verification" &&
                  artifacts.verification_execution_failure.stageCycle ==
                  state.cycles["verification"] &&
                  artifacts.verification_execution_failure.dispatchAttempt == 1 &&
                  artifacts.verification_execution_failure.failureKind == "operational" &&
                  artifacts.verification_execution_failure.authorityWorkflow ==
                  "factory-execution-failure-authorizer" &&
                  artifacts.verification_execution_failure.authorityReceiptName ==
                  "factory-execution-failure-" +
                  artifacts.verification_execution_failure.receiptDigest &&
                  artifacts.verification_execution_failure.authorityDigest ==
                  artifacts.verification_execution_failure.receiptDigest &&
                  artifacts.verification_execution_failure.executionReceipt.status == "failed" &&
                  ((artifacts.verification_execution_failure.executionReceipt.kind == "workflow" &&
                  has(artifacts.verification_execution_failure.executionReceipt.workflowName) &&
                  has(artifacts.verification_execution_failure.executionReceipt.workflowRunId) &&
                  has(artifacts.verification_execution_failure.executionReceipt.inputsDigest)) ||
                  (artifacts.verification_execution_failure.executionReceipt.kind == "command" &&
                  has(artifacts.verification_execution_failure.executionReceipt.operation) &&
                  has(artifacts.verification_execution_failure.executionReceipt.command) &&
                  has(artifacts.verification_execution_failure.executionReceipt.exitCode) &&
                  has(artifacts.verification_execution_failure.executionReceipt.stdoutDigest) &&
                  has(artifacts.verification_execution_failure.executionReceipt.stderrDigest)))
                message: >-
                  operational recovery requires a trusted content-addressed receipt from the current
                  verification cycle and dispatch
            - type: workflow-succeeded
              config:
                workflow: factory-execution-failure-authorizer
                requireStepOutputs:
                  - artifact-verification-execution-failure
    - id: preflight-recovery
      description: >-
        Pause after an operational preflight failure, preserve its evidence, and retry only after
        repair.
      transitions:
        - name: retry-preflight
          to: preflight
          gates:
            - type: human-approval
              config:
                id: retry-preflight
    - id: implementation-recovery
      description: >-
        Pause after an operational implementation failure, preserve its evidence, and retry only
        after repair.
      transitions:
        - name: retry-implementation
          to: implementation
          gates:
            - type: human-approval
              config:
                id: retry-implementation
    - id: classify-recovery
      description: >-
        Pause after an operational classify failure, preserve its evidence, and retry only after
