                minLength: 1
              verificationWorkflowRunId:
                type: string
                minLength: 1
              renderMatrixManifestDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              renderMatrixBundleDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              renderMatrixRunDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              renderEvidenceArchiveDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              approvalReceiptId:
                type: string
                pattern: '^[0-9a-f]{64}$'
              approvalIdentity:
                type: string
                minLength: 1
              decision:
                type: string
                enum:
                  - accept
                  - reject
              note:
                type: string
        - name: aesthetic-decision-binding-execution-failure
          description: >-
            Content-addressed operational failure generated from an actual execution receipt for the
            current dispatch.
          schema:
            type: object
            additionalProperties: false
            required:
              - schemaVersion
              - receiptDigest
              - sourceFactoryId
              - workItem
              - stage
              - stageCycle
              - dispatchAttempt
              - dispatchRunId
              - failureKind
              - category
              - executionReceipt
              - retryable
              - error
              - occurredAt
              - authorityWorkflow
              - authorityReceiptName
              - authorityDigest
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 5
