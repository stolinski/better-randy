        only after repair.
      transitions:
        - name: retry-escalated-observability
          to: escalated-observability
          gates:
            - type: human-approval
              config:
                id: retry-escalated-observability
    - id: done
      terminal: true
    - id: aborted
      terminal: true
    - id: operational-escalation
      terminal: true
      description: Human-escalated terminal state for an unrecoverable operational Factory failure.
  globalTransitions:
    - name: abort
      to: aborted-observability
      gates:
        - type: human-approval
          config:
            id: abort-confirmation
    - name: escalate-operational-failure
      to: escalated-observability
      gates:
        - type: human-approval
          config:
            id: operational-escalation
