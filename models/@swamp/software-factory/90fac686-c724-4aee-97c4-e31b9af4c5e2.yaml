                      - command
                  receiptId:
                    type: string
                    minLength: 1
                  status:
                    type: string
                    enum:
                      - failed
                  workflowName:
                    type: string
                    minLength: 1
                  workflowRunId:
                    type: string
                    minLength: 1
                  inputsDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  operation:
                    type: string
                    minLength: 1
                  command:
                    type: string
                    minLength: 1
                  exitCode:
                    type: integer
                  stdoutDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  stderrDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
              retryable:
