type: '@swamp/software-factory'
typeVersion: 2026.06.24.1
version: 38
globalArguments:
  stages:
    - id: preflight
      initial: true
      description: Run the consumer policy adapter before implementation.
      maxDispatchesPerCycle: 1
      work:
        mode: workflow
        workflow:
          name: factory-policy-sweep
          inputs:
            evidenceName: preflight-run
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          properties:
            evidenceName:
              type: string
              enum:
                - preflight-run
            workItem:
              type: string
              minLength: 1
          required:
            - workItem
            - evidenceName
          additionalProperties: false
        resultEvidence: preflight-run
      artifacts:
        - name: preflight-execution-failure
          description: >-
            Content-addressed operational failure generated from an actual execution receipt for the
            current dispatch.
          schema:
            type: object
            additionalProperties: false
            required:
              - schemaVersion
              - receiptDigest
              - sourceFactoryId
              - workItem
              - stage
              - stageCycle
              - dispatchAttempt
              - dispatchRunId
              - failureKind
              - category
              - executionReceipt
              - retryable
              - error
              - occurredAt
              - authorityWorkflow
              - authorityReceiptName
              - authorityDigest
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 5
              receiptDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              sourceFactoryId:
                type: string
                enum:
                  - 90fac686-c724-4aee-97c4-e31b9af4c5e2
              workItem:
                type: string
                minLength: 1
              stage:
                type: string
                enum:
                  - preflight
              stageCycle:
                type: integer
                minimum: 1
              dispatchAttempt:
                type: integer
                minimum: 1
              dispatchRunId:
                type: string
                pattern: '^[0-9a-f]{64}$'
              failureKind:
                type: string
                enum:
                  - operational
              category:
                type: string
                enum:
                  - prerequisite
                  - tool-unavailable
                  - workflow-failed
                  - method-failed
              executionReceipt:
                type: object
                additionalProperties: false
                required:
                  - kind
                  - receiptId
                  - status
                properties:
                  kind:
                    type: string
                    enum:
                      - workflow
                      - command
                  receiptId:
                    type: string
                    minLength: 1
                  status:
                    type: string
                    enum:
                      - failed
                  workflowName:
                    type: string
                    minLength: 1
                  workflowRunId:
                    type: string
                    minLength: 1
                  inputsDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  operation:
                    type: string
                    minLength: 1
                  command:
                    type: string
                    minLength: 1
                  exitCode:
                    type: integer
                  stdoutDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  stderrDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
              retryable:
                type: boolean
              error:
                type: string
                minLength: 1
                maxLength: 2000
              occurredAt:
                type: string
                minLength: 1
              authorityWorkflow:
                type: string
                enum:
                  - factory-execution-failure-authorizer
              authorityReceiptName:
                type: string
                pattern: '^factory-execution-failure-[A-Za-z0-9._:-]+$'
              authorityDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
      transitions:
        - name: implement
          to: implementation
          gates:
            - type: workflow-succeeded
              config:
                workflow: factory-policy-sweep
                requireStepOutputs:
                  - evidence-preflight-run
        - name: operational-pause
          to: preflight-recovery
          gates:
            - type: artifact-exists
              config:
                artifact: preflight-execution-failure
            - type: cel
              config:
                expr: >-
                  artifacts.preflight_execution_failure.sourceFactoryId ==
                  "90fac686-c724-4aee-97c4-e31b9af4c5e2" &&
                  artifacts.preflight_execution_failure.workItem == workItem &&
                  artifacts.preflight_execution_failure.stage == "preflight" &&
                  artifacts.preflight_execution_failure.stageCycle == state.cycles["preflight"] &&
                  artifacts.preflight_execution_failure.dispatchAttempt == 1 &&
                  artifacts.preflight_execution_failure.failureKind == "operational" &&
                  artifacts.preflight_execution_failure.authorityWorkflow ==
                  "factory-execution-failure-authorizer" &&
                  artifacts.preflight_execution_failure.authorityReceiptName ==
                  "factory-execution-failure-" + artifacts.preflight_execution_failure.receiptDigest
                  && artifacts.preflight_execution_failure.authorityDigest ==
                  artifacts.preflight_execution_failure.receiptDigest &&
                  artifacts.preflight_execution_failure.executionReceipt.status == "failed" &&
                  ((artifacts.preflight_execution_failure.executionReceipt.kind == "workflow" &&
                  has(artifacts.preflight_execution_failure.executionReceipt.workflowName) &&
                  has(artifacts.preflight_execution_failure.executionReceipt.workflowRunId) &&
                  has(artifacts.preflight_execution_failure.executionReceipt.inputsDigest)) ||
                  (artifacts.preflight_execution_failure.executionReceipt.kind == "command" &&
                  has(artifacts.preflight_execution_failure.executionReceipt.operation) &&
                  has(artifacts.preflight_execution_failure.executionReceipt.command) &&
                  has(artifacts.preflight_execution_failure.executionReceipt.exitCode) &&
                  has(artifacts.preflight_execution_failure.executionReceipt.stdoutDigest) &&
                  has(artifacts.preflight_execution_failure.executionReceipt.stderrDigest)))
                message: >-
                  operational recovery requires a trusted content-addressed receipt from the current
                  preflight cycle and dispatch
            - type: workflow-succeeded
              config:
                workflow: factory-execution-failure-authorizer
                requireStepOutputs:
                  - artifact-preflight-execution-failure
    - id: implementation
      description: Implement the current Dex work item and record a compact change summary.
      maxCycles: 5
      maxDispatchesPerCycle: 1
      work:
        mode: dispatch
        skills:
          - supers-domain-aware-implementation
        systemPrompt: >-
          Implement only the current Dex work item in the Pi-managed isolated worktree. Follow
          repository guidance already loaded by the agent. Complete required source, documentation,
          and tracker-file edits, commit the lane, and return the strict child revision plus durable
          handoff manifest path. Load the exact union of skills and constraints from the
          schema-validated preflight work-domain route; never infer routing from agent prose. The
          central parent must verify and integrate that handoff while this work item remains in
          implementation. Only after serialized integration may the parent record change-summary
          with the digest-verified, content-addressed integrationReceipt.
        constraints: .claude/skills/supers-domain-aware-implementation/SKILL.md
      artifacts:
        - name: change-summary
          description: Compact implementation summary used as the classification subject.
          schema:
            type: object
            required:
              - summary
              - integrationReceipt
            properties:
              summary:
                type: string
                minLength: 1
              commit:
                type: string
                minLength: 7
              integrationReceipt:
                type: object
                properties:
                  schemaVersion:
                    type: integer
                    enum:
                      - 1
                  receiptId:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  rootEpicId:
                    type: string
                    pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
                  activeTaskId:
                    type: string
                    pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
                  factoryName:
                    type: string
                    enum:
                      - supers-delivery
                  handoffManifestDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  targetBaselineRevision:
                    type: string
                    pattern: '^[0-9a-f]{40,64}$'
                  childRevisionEvidence:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - verified
                      childCommittedRevision:
                        type: string
                        pattern: '^[0-9a-f]{40,64}$'
                    required:
                      - status
                      - childCommittedRevision
                    additionalProperties: false
                  disposition:
                    type: string
                    enum:
                      - integrated
                  baseCommit:
                    type: string
                    pattern: '^[0-9a-f]{40,64}$'
                  patchDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  changedPaths:
                    type: array
                    items:
                      type: string
                      minLength: 1
                    minItems: 1
                  integratedRevision:
                    type: string
                    pattern: '^[0-9a-f]{40,64}$'
                  integratedTreeFingerprint:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  rejectionReason:
                    type: string
                    enum:
                      - none
                required:
                  - schemaVersion
                  - receiptId
                  - rootEpicId
                  - activeTaskId
                  - factoryName
                  - handoffManifestDigest
                  - targetBaselineRevision
                  - childRevisionEvidence
                  - disposition
                  - baseCommit
                  - patchDigest
                  - changedPaths
                  - integratedRevision
                  - integratedTreeFingerprint
                  - rejectionReason
                additionalProperties: false
        - name: implementation-execution-failure
          description: >-
            Content-addressed operational failure generated from an actual execution receipt for the
            current dispatch.
          schema:
            type: object
            additionalProperties: false
            required:
              - schemaVersion
              - receiptDigest
              - sourceFactoryId
              - workItem
              - stage
              - stageCycle
              - dispatchAttempt
              - dispatchRunId
              - failureKind
              - category
              - executionReceipt
              - retryable
              - error
              - occurredAt
              - authorityWorkflow
              - authorityReceiptName
              - authorityDigest
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 5
              receiptDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              sourceFactoryId:
                type: string
                enum:
                  - 90fac686-c724-4aee-97c4-e31b9af4c5e2
              workItem:
                type: string
                minLength: 1
              stage:
                type: string
                enum:
                  - implementation
              stageCycle:
                type: integer
                minimum: 1
              dispatchAttempt:
                type: integer
                minimum: 1
              dispatchRunId:
                type: string
                pattern: '^[0-9a-f]{64}$'
              failureKind:
                type: string
                enum:
                  - operational
              category:
                type: string
                enum:
                  - prerequisite
                  - tool-unavailable
                  - workflow-failed
                  - method-failed
              executionReceipt:
                type: object
                additionalProperties: false
                required:
                  - kind
                  - receiptId
                  - status
                properties:
                  kind:
                    type: string
                    enum:
                      - workflow
                      - command
                  receiptId:
                    type: string
                    minLength: 1
                  status:
                    type: string
                    enum:
                      - failed
                  workflowName:
                    type: string
                    minLength: 1
                  workflowRunId:
                    type: string
                    minLength: 1
                  inputsDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  operation:
                    type: string
                    minLength: 1
                  command:
                    type: string
                    minLength: 1
                  exitCode:
                    type: integer
                  stdoutDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  stderrDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
              retryable:
                type: boolean
              error:
                type: string
                minLength: 1
                maxLength: 2000
              occurredAt:
                type: string
                minLength: 1
              authorityWorkflow:
                type: string
                enum:
                  - factory-execution-failure-authorizer
              authorityReceiptName:
                type: string
                pattern: '^factory-execution-failure-[A-Za-z0-9._:-]+$'
              authorityDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
      transitions:
        - name: classify
          to: classify
          gates:
            - type: artifact-exists
              config:
                artifact: change-summary
        - name: operational-pause
          to: implementation-recovery
          gates:
            - type: artifact-exists
              config:
                artifact: implementation-execution-failure
            - type: cel
              config:
                expr: >-
                  artifacts.implementation_execution_failure.sourceFactoryId ==
                  "90fac686-c724-4aee-97c4-e31b9af4c5e2" &&
                  artifacts.implementation_execution_failure.workItem == workItem &&
                  artifacts.implementation_execution_failure.stage == "implementation" &&
                  artifacts.implementation_execution_failure.stageCycle ==
                  state.cycles["implementation"] &&
                  artifacts.implementation_execution_failure.dispatchAttempt == 1 &&
                  artifacts.implementation_execution_failure.failureKind == "operational" &&
                  artifacts.implementation_execution_failure.authorityWorkflow ==
                  "factory-execution-failure-authorizer" &&
                  artifacts.implementation_execution_failure.authorityReceiptName ==
                  "factory-execution-failure-" +
                  artifacts.implementation_execution_failure.receiptDigest &&
                  artifacts.implementation_execution_failure.authorityDigest ==
                  artifacts.implementation_execution_failure.receiptDigest &&
                  artifacts.implementation_execution_failure.executionReceipt.status == "failed" &&
                  ((artifacts.implementation_execution_failure.executionReceipt.kind == "workflow"
                  && has(artifacts.implementation_execution_failure.executionReceipt.workflowName)
                  && has(artifacts.implementation_execution_failure.executionReceipt.workflowRunId)
                  && has(artifacts.implementation_execution_failure.executionReceipt.inputsDigest))
                  || (artifacts.implementation_execution_failure.executionReceipt.kind == "command"
                  && has(artifacts.implementation_execution_failure.executionReceipt.operation) &&
                  has(artifacts.implementation_execution_failure.executionReceipt.command) &&
                  has(artifacts.implementation_execution_failure.executionReceipt.exitCode) &&
                  has(artifacts.implementation_execution_failure.executionReceipt.stdoutDigest) &&
                  has(artifacts.implementation_execution_failure.executionReceipt.stderrDigest)))
                message: >-
                  operational recovery requires a trusted content-addressed receipt from the current
                  implementation cycle and dispatch
            - type: workflow-succeeded
              config:
                workflow: factory-execution-failure-authorizer
                requireStepOutputs:
                  - artifact-implementation-execution-failure
    - id: classify
      description: 'Derive a trusted, complete verification plan through the consumer adapter.'
      maxDispatchesPerCycle: 1
      work:
        mode: workflow
        workflow:
          name: factory-classify-change
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          properties:
            workItem:
              type: string
              minLength: 1
          required:
            - workItem
          additionalProperties: false
        resultEvidence: classify-run
      artifacts:
        - name: change-impact
          description: Trusted classification and complete verification plan for the current change.
          reviews: change-summary
          schema:
            type: object
            required:
              - requiredLanes
              - changeFingerprint
              - audit
              - generatedAt
              - source
              - workItem
              - baselineHead
              - treeFingerprint
              - paths
              - classification
              - domains
              - unknownPaths
              - intentRouteDigest
              - surfaces
              - requiredHumanReviews
              - lanes
            properties:
              requiredLanes:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - id
                    - reasons
                  properties:
                    id:
                      type: string
                      minLength: 1
                    reasons:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
              reviewCandidate:
                type: boolean
              changeFingerprint:
                type: string
                minLength: 1
              audit:
                type: string
                enum:
                  - change-impact
              generatedAt:
                type: string
              source:
                type: string
                enum:
                  - git-baseline-and-working-tree
              workItem:
                type: string
                minLength: 1
              baselineHead:
                type: string
                pattern: '^[0-9a-f]{40,64}$'
              treeFingerprint:
                type: string
                pattern: '^[0-9a-f]{64}$'
              paths:
                type: array
                items:
                  type: string
              classification:
                type: string
                enum:
                  - known
                  - mixed
                  - unknown
              domains:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      enum:
                        - preset
                        - pack
                        - authoring-app
                        - rendering
                        - export
                        - performance
                        - repository-infrastructure
                        - swamp-control-plane
                        - documentation-planning
                        - unknown
                    reasons:
                      type: array
                      items:
                        type: string
                      minItems: 1
                  required:
                    - id
                    - reasons
                  additionalProperties: false
                minItems: 1
              unknownPaths:
                type: array
                items:
                  type: string
              intentRouteDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              surfaces:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      enum:
                        - authoring-app
                        - rendered-composition
                        - export-pipeline
                        - control-plane
                    reasons:
                      type: array
                      items:
                        type: string
                      minItems: 1
                  required:
                    - id
                    - reasons
                  additionalProperties: false
                minItems: 1
              requiredHumanReviews:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                        - authoring-app-visual
                        - rendered-composition-aesthetic
                    reasons:
                      type: array
                      items:
                        type: string
                      minItems: 1
                  required:
                    - kind
                    - reasons
                  additionalProperties: false
              lanes:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    reasons:
                      type: array
                      items:
                        type: string
                      minItems: 1
                  required:
                    - id
                    - reasons
                minItems: 1
        - name: classify-execution-failure
          description: >-
            Content-addressed operational failure generated from an actual execution receipt for the
            current dispatch.
          schema:
            type: object
            additionalProperties: false
            required:
              - schemaVersion
              - receiptDigest
              - sourceFactoryId
              - workItem
              - stage
              - stageCycle
              - dispatchAttempt
              - dispatchRunId
              - failureKind
              - category
              - executionReceipt
              - retryable
              - error
              - occurredAt
              - authorityWorkflow
              - authorityReceiptName
              - authorityDigest
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 5
              receiptDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              sourceFactoryId:
                type: string
                enum:
                  - 90fac686-c724-4aee-97c4-e31b9af4c5e2
              workItem:
                type: string
                minLength: 1
              stage:
                type: string
                enum:
                  - classify
              stageCycle:
                type: integer
                minimum: 1
              dispatchAttempt:
                type: integer
                minimum: 1
              dispatchRunId:
                type: string
                pattern: '^[0-9a-f]{64}$'
              failureKind:
                type: string
                enum:
                  - operational
              category:
                type: string
                enum:
                  - prerequisite
                  - tool-unavailable
                  - workflow-failed
                  - method-failed
              executionReceipt:
                type: object
                additionalProperties: false
                required:
                  - kind
                  - receiptId
                  - status
                properties:
                  kind:
                    type: string
                    enum:
                      - workflow
                      - command
                  receiptId:
                    type: string
                    minLength: 1
                  status:
                    type: string
                    enum:
                      - failed
                  workflowName:
                    type: string
                    minLength: 1
                  workflowRunId:
                    type: string
                    minLength: 1
                  inputsDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  operation:
                    type: string
                    minLength: 1
                  command:
                    type: string
                    minLength: 1
                  exitCode:
                    type: integer
                  stdoutDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  stderrDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
              retryable:
                type: boolean
              error:
                type: string
                minLength: 1
                maxLength: 2000
              occurredAt:
                type: string
                minLength: 1
              authorityWorkflow:
                type: string
                enum:
                  - factory-execution-failure-authorizer
              authorityReceiptName:
                type: string
                pattern: '^factory-execution-failure-[A-Za-z0-9._:-]+$'
              authorityDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
      transitions:
        - name: verify
          to: verification
          gates:
            - type: workflow-succeeded
              config:
                workflow: factory-classify-change
                requireStepOutputs:
                  - artifact-change-impact
                  - evidence-classify-run
            - type: artifact-fresh
              config:
                artifact: change-impact
                recordedThisCycle: true
        - name: operational-pause
          to: classify-recovery
          gates:
            - type: artifact-exists
              config:
                artifact: classify-execution-failure
            - type: cel
              config:
                expr: >-
                  artifacts.classify_execution_failure.sourceFactoryId ==
                  "90fac686-c724-4aee-97c4-e31b9af4c5e2" &&
                  artifacts.classify_execution_failure.workItem == workItem &&
                  artifacts.classify_execution_failure.stage == "classify" &&
                  artifacts.classify_execution_failure.stageCycle == state.cycles["classify"] &&
                  artifacts.classify_execution_failure.dispatchAttempt == 1 &&
                  artifacts.classify_execution_failure.failureKind == "operational" &&
                  artifacts.classify_execution_failure.authorityWorkflow ==
                  "factory-execution-failure-authorizer" &&
                  artifacts.classify_execution_failure.authorityReceiptName ==
                  "factory-execution-failure-" + artifacts.classify_execution_failure.receiptDigest
                  && artifacts.classify_execution_failure.authorityDigest ==
                  artifacts.classify_execution_failure.receiptDigest &&
                  artifacts.classify_execution_failure.executionReceipt.status == "failed" &&
                  ((artifacts.classify_execution_failure.executionReceipt.kind == "workflow" &&
                  has(artifacts.classify_execution_failure.executionReceipt.workflowName) &&
                  has(artifacts.classify_execution_failure.executionReceipt.workflowRunId) &&
                  has(artifacts.classify_execution_failure.executionReceipt.inputsDigest)) ||
                  (artifacts.classify_execution_failure.executionReceipt.kind == "command" &&
                  has(artifacts.classify_execution_failure.executionReceipt.operation) &&
                  has(artifacts.classify_execution_failure.executionReceipt.command) &&
                  has(artifacts.classify_execution_failure.executionReceipt.exitCode) &&
                  has(artifacts.classify_execution_failure.executionReceipt.stdoutDigest) &&
                  has(artifacts.classify_execution_failure.executionReceipt.stderrDigest)))
                message: >-
                  operational recovery requires a trusted content-addressed receipt from the current
                  classify cycle and dispatch
            - type: workflow-succeeded
              config:
                workflow: factory-execution-failure-authorizer
                requireStepOutputs:
                  - artifact-classify-execution-failure
    - id: verification
      description: Derive the only route from complete correlated deterministic evidence.
      maxCycles: 5
      maxDispatchesPerCycle: 1
      work:
        mode: workflow
        workflow:
          name: supers-delivery-deterministic-verification
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          properties:
            workItem:
              type: string
              minLength: 1
          required:
            - workItem
          additionalProperties: false
        resultEvidence: verification-run
      artifacts:
        - name: verification
          description: Correlated model-derived objective routing authority.
          reviews: change-impact
          schema:
            type: object
            additionalProperties: false
            required:
              - schemaVersion
              - workItem
              - integratedRevision
              - integratedTreeFingerprint
              - treeFingerprint
              - changeImpactResourceName
              - changedPaths
              - deterministicFanoutResourceName
              - deterministicFanoutContentDigest
              - deterministicFanoutWorkflowRunId
              - policySweepResourceName
              - policySweepWorkflowId
              - policySweepWorkflowName
              - policySweepWorkflowVersion
              - policySweepWorkflowRunId
              - policySweepExecutionDigest
              - policySweepLifecycleIntegrity
              - renderMatrixRunName
              - renderMatrixManifestName
              - renderMatrixBundleName
              - renderMatrixManifestDigest
              - renderMatrixBundleDigest
              - renderMatrixRunDigest
              - renderEvidenceArchiveDigest
              - workflowRunId
              - requiredHumanReviewKinds
              - disposition
              - objectiveFailureCodes
              - unavailableEvidenceCodes
              - advisories
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 3
              workItem:
                type: string
                minLength: 1
              integratedRevision:
                type: string
                pattern: '^[0-9a-f]{40,64}$'
              integratedTreeFingerprint:
                type: string
                pattern: '^[0-9a-f]{64}$'
              treeFingerprint:
                type: string
                pattern: '^[0-9a-f]{64}$'
              changeImpactResourceName:
                type: string
                minLength: 1
              changedPaths:
                type: array
                minItems: 1
                maxItems: 200
                items:
                  type: string
                  minLength: 1
              deterministicFanoutResourceName:
                type: string
                minLength: 1
              deterministicFanoutContentDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              deterministicFanoutWorkflowRunId:
                type: string
                minLength: 1
              policySweepResourceName:
