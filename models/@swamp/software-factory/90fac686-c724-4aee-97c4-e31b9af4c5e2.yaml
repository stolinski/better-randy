type: '@swamp/software-factory'
typeVersion: 2026.06.24.1
version: 15
globalArguments:
  stages:
    - id: preflight
      initial: true
      description: Run the consumer policy adapter before implementation.
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: factory-policy-sweep
          inputs:
            workItem: '${{ self.workItem }}'
            evidenceName: preflight-run
        inputsSchema:
          type: object
          properties:
            workItem:
              type: string
              minLength: 1
            evidenceName:
              type: string
              enum:
                - preflight-run
          required:
            - workItem
            - evidenceName
          additionalProperties: false
        resultEvidence: preflight-run
      transitions:
        - name: implement
          to: implementation
          gates:
            - type: workflow-succeeded
              config:
                workflow: factory-policy-sweep
                requireStepOutputs:
                  - evidence-preflight-run
    - id: implementation
      description: Implement the current Dex work item and record a compact change summary.
      maxCycles: 5
      maxDispatchesPerCycle: 2
      work:
        mode: interactive
        systemPrompt: >-
          Implement only the current Dex work item in the Pi-managed isolated worktree. Follow
          repository guidance already loaded by the agent. Complete required source, documentation,
          and tracker-file edits, commit the lane, and return the strict child revision plus durable
          handoff manifest path. The central parent must verify and integrate that handoff while
          this work item remains in implementation. Only after serialized integration may the parent
          record change-summary with the digest-verified, content-addressed integrationReceipt.
      artifacts:
        - name: change-summary
          description: Compact implementation summary used as the classification subject.
          schema:
            type: object
            required:
              - summary
              - integrationReceipt
            properties:
              summary:
                type: string
                minLength: 1
              commit:
                type: string
                minLength: 7
              integrationReceipt:
                type: object
                properties:
                  schemaVersion:
                    type: integer
                    enum:
                      - 1
                  receiptId:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  rootEpicId:
                    type: string
                    pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
                  activeTaskId:
                    type: string
                    pattern: '^[a-z0-9][a-z0-9._:-]{0,127}$'
                  factoryName:
                    type: string
                    enum:
                      - supers-delivery
                  handoffManifestDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  targetBaselineRevision:
                    type: string
                    pattern: '^[0-9a-f]{40,64}$'
                  childRevisionEvidence:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - verified
                      childCommittedRevision:
                        type: string
                        pattern: '^[0-9a-f]{40,64}$'
                    required:
                      - status
                      - childCommittedRevision
                    additionalProperties: false
                  disposition:
                    type: string
                    enum:
                      - integrated
                  baseCommit:
                    type: string
                    pattern: '^[0-9a-f]{40,64}$'
                  patchDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  changedPaths:
                    type: array
                    items:
                      type: string
                      minLength: 1
                    minItems: 1
                  integratedRevision:
                    type: string
                    pattern: '^[0-9a-f]{40,64}$'
                  integratedTreeFingerprint:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
                  rejectionReason:
                    type: string
                    enum:
                      - none
                required:
                  - schemaVersion
                  - receiptId
                  - rootEpicId
                  - activeTaskId
                  - factoryName
                  - handoffManifestDigest
                  - targetBaselineRevision
                  - childRevisionEvidence
                  - disposition
                  - baseCommit
                  - patchDigest
                  - changedPaths
                  - integratedRevision
                  - integratedTreeFingerprint
                  - rejectionReason
                additionalProperties: false
      transitions:
        - name: classify
          to: classify
          gates:
            - type: artifact-exists
              config:
                artifact: change-summary
    - id: classify
      description: 'Derive a trusted, complete verification plan through the consumer adapter.'
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: factory-classify-change
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          properties:
            workItem:
              type: string
              minLength: 1
          required:
            - workItem
          additionalProperties: false
        resultEvidence: classify-run
      artifacts:
        - name: change-impact
          description: Trusted classification and complete verification plan for the current change.
          reviews: change-summary
          schema:
            type: object
            required:
              - requiredLanes
              - changeFingerprint
              - audit
              - generatedAt
              - source
              - workItem
              - baselineHead
              - treeFingerprint
              - paths
              - lanes
            properties:
              requiredLanes:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - id
                    - reasons
                  properties:
                    id:
                      type: string
                      minLength: 1
                    reasons:
                      type: array
                      minItems: 1
                      items:
                        type: string
                        minLength: 1
              reviewCandidate:
                type: boolean
              changeFingerprint:
                type: string
                minLength: 1
              audit:
                type: string
                enum:
                  - change-impact
              generatedAt:
                type: string
              source:
                type: string
                enum:
                  - git-baseline-and-working-tree
              workItem:
                type: string
                minLength: 1
              baselineHead:
                type: string
                pattern: '^[0-9a-f]{40,64}$'
              treeFingerprint:
                type: string
                pattern: '^[0-9a-f]{64}$'
              paths:
                type: array
                items:
                  type: string
              lanes:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    reasons:
                      type: array
                      items:
                        type: string
                      minItems: 1
                  required:
                    - id
                    - reasons
                minItems: 1
      transitions:
        - name: verify
          to: verification
          gates:
            - type: workflow-succeeded
              config:
                workflow: factory-classify-change
                requireStepOutputs:
                  - artifact-change-impact
                  - evidence-classify-run
            - type: artifact-fresh
              config:
                artifact: change-impact
                recordedThisCycle: true
    - id: verification
      description: Derive the only route from complete correlated deterministic evidence.
      maxCycles: 5
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: supers-delivery-deterministic-verification
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          properties:
            workItem:
              type: string
              minLength: 1
          required:
            - workItem
          additionalProperties: false
        resultEvidence: verification-run
      artifacts:
        - name: verification
          description: Correlated model-derived objective routing authority.
          reviews: change-impact
          schema:
            type: object
            additionalProperties: false
            required:
              - schemaVersion
              - workItem
              - integratedRevision
              - integratedTreeFingerprint
              - treeFingerprint
              - changeImpactResourceName
              - deterministicFanoutResourceName
              - deterministicFanoutContentDigest
              - deterministicFanoutWorkflowRunId
              - policySweepResourceName
              - policySweepWorkflowId
              - policySweepWorkflowName
              - policySweepWorkflowVersion
              - policySweepWorkflowRunId
              - policySweepExecutionDigest
              - policyReceipts
              - corpusReceipt
              - renderMatrixRunName
              - renderMatrixManifestName
              - renderMatrixBundleName
              - renderMatrixManifestDigest
              - renderMatrixBundleDigest
              - renderMatrixRunDigest
              - renderEvidenceArchiveDigest
              - workflowRunId
              - disposition
              - objectiveFailureCodes
              - unavailableEvidenceCodes
              - advisories
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 1
              workItem:
                type: string
                minLength: 1
              integratedRevision:
                type: string
                pattern: '^[0-9a-f]{40,64}$'
              integratedTreeFingerprint:
                type: string
                pattern: '^[0-9a-f]{64}$'
              treeFingerprint:
                type: string
                pattern: '^[0-9a-f]{64}$'
              changeImpactResourceName:
                type: string
                minLength: 1
              deterministicFanoutResourceName:
                type: string
                minLength: 1
              deterministicFanoutContentDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              deterministicFanoutWorkflowRunId:
                type: string
                minLength: 1
              policySweepResourceName:
                type: string
                minLength: 1
              policySweepWorkflowId:
                type: string
                enum:
                  - 5eb573fe-76e7-4b59-8ff6-bfccc0ec3b7a
              policySweepWorkflowName:
                type: string
                enum:
                  - policy-sweep
              policySweepWorkflowVersion:
                type: integer
                enum:
                  - 2
              policySweepWorkflowRunId:
                type: string
                minLength: 1
              policySweepExecutionDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              policyReceipts:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - modelName
                    - specName
                    - resourceName
                    - workflowRunId
                    - contentDigest
                  properties:
                    modelName:
                      type: string
                      minLength: 1
                    specName:
                      type: string
                      minLength: 1
                    resourceName:
                      type: string
                      minLength: 1
                    workflowRunId:
                      type: string
                      minLength: 1
                    contentDigest:
                      type: string
                      pattern: '^[0-9a-f]{64}$'
              corpusReceipt:
                type: object
                additionalProperties: false
                required:
                  - modelName
                  - specName
                  - resourceName
                  - workflowRunId
                  - contentDigest
                properties:
                  modelName:
                    type: string
                    minLength: 1
                  specName:
                    type: string
                    minLength: 1
                  resourceName:
                    type: string
                    minLength: 1
                  workflowRunId:
                    type: string
                    minLength: 1
                  contentDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
              renderMatrixRunName:
                type: string
                minLength: 1
              renderMatrixManifestName:
                type: string
              renderMatrixBundleName:
                type: string
              renderMatrixManifestDigest:
                type: string
                pattern: '^$|^[0-9a-f]{64}$'
              renderMatrixBundleDigest:
                type: string
                pattern: '^$|^[0-9a-f]{64}$'
              renderMatrixRunDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              renderEvidenceArchiveDigest:
                type: string
                pattern: '^$|^[0-9a-f]{64}$'
              workflowRunId:
                type: string
                minLength: 1
              disposition:
                type: string
                enum:
                  - automatic-rework
                  - evidence-unavailable
                  - await-human-aesthetic
                  - reconcile
              objectiveFailureCodes:
                type: array
                items:
                  type: string
                  minLength: 1
              unavailableEvidenceCodes:
                type: array
                items:
                  type: string
                  minLength: 1
              advisories:
                type: array
                items:
                  type: object
      transitions:
        - name: automatic-rework
          to: implementation
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-delivery-deterministic-verification
                requireStepOutputs:
                  - artifact-verification
                  - evidence-verification-run
            - type: artifact-fresh
              config:
                artifact: verification
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.verification.workItem == state.workItem &&
                  artifacts.verification.integratedRevision ==
                  artifacts.change_summary.integrationReceipt.integratedRevision &&
                  artifacts.verification.integratedTreeFingerprint ==
                  artifacts.change_summary.integrationReceipt.integratedTreeFingerprint &&
                  artifacts.verification.treeFingerprint ==
                  artifacts.change_impact.changeFingerprint && artifacts.verification.disposition ==
                  "automatic-rework" && size(artifacts.verification.objectiveFailureCodes) > 0 &&
                  size(artifacts.verification.unavailableEvidenceCodes) == 0
                message: automatic rework requires fresh complete closed objective failure evidence
        - name: evidence-unavailable
          to: evidence-unavailable
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-delivery-deterministic-verification
                requireStepOutputs:
                  - artifact-verification
                  - evidence-verification-run
            - type: artifact-fresh
              config:
                artifact: verification
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.verification.workItem == state.workItem &&
                  artifacts.verification.integratedRevision ==
                  artifacts.change_summary.integrationReceipt.integratedRevision &&
                  artifacts.verification.integratedTreeFingerprint ==
                  artifacts.change_summary.integrationReceipt.integratedTreeFingerprint &&
                  artifacts.verification.treeFingerprint ==
                  artifacts.change_impact.changeFingerprint && artifacts.verification.disposition ==
                  "evidence-unavailable" && size(artifacts.verification.unavailableEvidenceCodes) >
                  0
                message: unavailable evidence pauses Delivery without authorizing mutation
        - name: await-human-aesthetic
          to: aesthetic-approval
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-delivery-deterministic-verification
                requireStepOutputs:
                  - artifact-verification
                  - evidence-verification-run
            - type: artifact-fresh
              config:
                artifact: verification
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.verification.workItem == state.workItem &&
                  artifacts.verification.integratedRevision ==
                  artifacts.change_summary.integrationReceipt.integratedRevision &&
                  artifacts.verification.integratedTreeFingerprint ==
                  artifacts.change_summary.integrationReceipt.integratedTreeFingerprint &&
                  artifacts.verification.treeFingerprint ==
                  artifacts.change_impact.changeFingerprint && artifacts.verification.disposition ==
                  "await-human-aesthetic" && size(artifacts.verification.objectiveFailureCodes) == 0
                  && size(artifacts.verification.unavailableEvidenceCodes) == 0 &&
                  artifacts.verification.renderMatrixManifestDigest.matches("^[0-9a-f]{64}$") &&
                  artifacts.verification.renderMatrixBundleDigest.matches("^[0-9a-f]{64}$") &&
                  artifacts.verification.renderMatrixRunDigest.matches("^[0-9a-f]{64}$") &&
                  artifacts.verification.renderEvidenceArchiveDigest.matches("^[0-9a-f]{64}$")
                message: aesthetic review requires a complete passing exact render bundle
        - name: reconcile
          to: reconciliation
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-delivery-deterministic-verification
                requireStepOutputs:
                  - artifact-verification
                  - evidence-verification-run
            - type: artifact-fresh
              config:
                artifact: verification
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.verification.workItem == state.workItem &&
                  artifacts.verification.integratedRevision ==
                  artifacts.change_summary.integrationReceipt.integratedRevision &&
                  artifacts.verification.integratedTreeFingerprint ==
                  artifacts.change_summary.integrationReceipt.integratedTreeFingerprint &&
                  artifacts.verification.treeFingerprint ==
                  artifacts.change_impact.changeFingerprint && artifacts.verification.disposition ==
                  "reconcile" && size(artifacts.verification.objectiveFailureCodes) == 0 &&
                  size(artifacts.verification.unavailableEvidenceCodes) == 0
                message: >-
                  reconciliation requires complete passing objective evidence and proven render
                  non-applicability
    - id: evidence-unavailable
      description: Pause the serialized Delivery tail until deterministic evidence can be retried.
      transitions:
        - name: retry-verification
          to: verification
          gates:
            - type: human-approval
              config:
                id: retry-verification
    - id: aesthetic-approval
      description: Pause the entire serialized integration queue for exact-bundle human aesthetic judgment.
      transitions:
        - name: bind-approval
          to: aesthetic-decision-binding
          gates:
            - type: human-approval
              config:
                id: aesthetic-acceptance
        - name: bind-rejection
          to: aesthetic-decision-binding
          gates:
            - type: cel
              config:
                expr: >-
                  has(approvals.aesthetic_acceptance) &&
                  approvals.aesthetic_acceptance.exists(approval, approval.decision == "rejected")
                message: human revision requires an explicit aesthetic-acceptance rejection
    - id: aesthetic-decision-binding
      description: Bind the trusted Factory approval record to the exact verified evidence bundle.
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: supers-bind-human-aesthetic-decision
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          properties:
            workItem:
              type: string
              minLength: 1
          required:
            - workItem
          additionalProperties: false
        resultEvidence: human-aesthetic-decision-run
      artifacts:
        - name: human-aesthetic-decision
          description: Trusted exact-bundle-bound Factory human aesthetic decision.
          reviews: verification
          schema:
            type: object
            additionalProperties: false
            required:
              - schemaVersion
              - decisionId
              - workItem
              - factoryName
              - gateId
              - stageId
              - cycle
              - verificationRouteResourceName
              - matrixBundleResourceName
              - factoryStateResourceName
              - factoryApprovalResourceName
              - integratedRevision
              - integratedTreeFingerprint
              - treeFingerprint
              - deterministicFanoutResourceName
              - deterministicFanoutContentDigest
              - deterministicFanoutWorkflowRunId
              - policySweepResourceName
              - policySweepWorkflowId
              - policySweepWorkflowName
              - policySweepWorkflowVersion
              - policySweepWorkflowRunId
              - policySweepExecutionDigest
              - policyReceipts
              - corpusReceipt
              - renderMatrixRunName
              - renderMatrixManifestName
              - renderMatrixBundleName
              - verificationWorkflowRunId
              - renderMatrixManifestDigest
              - renderMatrixBundleDigest
              - renderMatrixRunDigest
              - renderEvidenceArchiveDigest
              - approvalReceiptId
              - approvalIdentity
              - decision
              - note
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 1
              decisionId:
                type: string
                pattern: '^[0-9a-f]{64}$'
              workItem:
                type: string
                minLength: 1
              factoryName:
                type: string
                minLength: 1
              gateId:
                type: string
                enum:
                  - aesthetic-acceptance
              stageId:
                type: string
                enum:
                  - aesthetic-approval
              cycle:
                type: integer
                minimum: 1
              verificationRouteResourceName:
                type: string
                minLength: 1
              matrixBundleResourceName:
                type: string
                minLength: 1
              factoryStateResourceName:
                type: string
                minLength: 1
              factoryApprovalResourceName:
                type: string
                minLength: 1
              integratedRevision:
                type: string
                pattern: '^[0-9a-f]{40,64}$'
              integratedTreeFingerprint:
                type: string
                pattern: '^[0-9a-f]{64}$'
              treeFingerprint:
                type: string
                pattern: '^[0-9a-f]{64}$'
              deterministicFanoutResourceName:
                type: string
                minLength: 1
              deterministicFanoutContentDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              deterministicFanoutWorkflowRunId:
                type: string
                minLength: 1
              policySweepResourceName:
                type: string
                minLength: 1
              policySweepWorkflowId:
                type: string
                enum:
                  - 5eb573fe-76e7-4b59-8ff6-bfccc0ec3b7a
              policySweepWorkflowName:
                type: string
                enum:
                  - policy-sweep
              policySweepWorkflowVersion:
                type: integer
                enum:
                  - 2
              policySweepWorkflowRunId:
                type: string
                minLength: 1
              policySweepExecutionDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              policyReceipts:
                type: array
                minItems: 4
                maxItems: 4
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - modelName
                    - specName
                    - resourceName
                    - workflowRunId
                    - contentDigest
                  properties:
                    modelName:
                      type: string
                      minLength: 1
                    specName:
                      type: string
                      minLength: 1
                    resourceName:
                      type: string
                      minLength: 1
                    workflowRunId:
                      type: string
                      minLength: 1
                    contentDigest:
                      type: string
                      pattern: '^[0-9a-f]{64}$'
              corpusReceipt:
                type: object
                additionalProperties: false
                required:
                  - modelName
                  - specName
                  - resourceName
                  - workflowRunId
                  - contentDigest
                properties:
                  modelName:
                    type: string
                    minLength: 1
                  specName:
                    type: string
                    minLength: 1
                  resourceName:
                    type: string
                    minLength: 1
                  workflowRunId:
                    type: string
                    minLength: 1
                  contentDigest:
                    type: string
                    pattern: '^[0-9a-f]{64}$'
              renderMatrixRunName:
                type: string
                minLength: 1
              renderMatrixManifestName:
                type: string
                minLength: 1
              renderMatrixBundleName:
                type: string
                minLength: 1
              verificationWorkflowRunId:
                type: string
                minLength: 1
              renderMatrixManifestDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              renderMatrixBundleDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              renderMatrixRunDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              renderEvidenceArchiveDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              approvalReceiptId:
                type: string
                pattern: '^[0-9a-f]{64}$'
              approvalIdentity:
                type: string
                minLength: 1
              decision:
                type: string
                enum:
                  - accept
                  - reject
              note:
                type: string
      transitions:
        - name: accept
          to: reconciliation
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-bind-human-aesthetic-decision
                requireStepOutputs:
                  - artifact-human-aesthetic-decision
                  - evidence-human-aesthetic-decision-run
            - type: artifact-fresh
              config:
                artifact: human-aesthetic-decision
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.human_aesthetic_decision.decision == "accept" &&
                  artifacts.human_aesthetic_decision.integratedRevision ==
                  artifacts.verification.integratedRevision &&
                  artifacts.human_aesthetic_decision.integratedTreeFingerprint ==
                  artifacts.verification.integratedTreeFingerprint &&
                  artifacts.human_aesthetic_decision.treeFingerprint ==
                  artifacts.verification.treeFingerprint &&
                  artifacts.human_aesthetic_decision.deterministicFanoutResourceName ==
                  artifacts.verification.deterministicFanoutResourceName &&
                  artifacts.human_aesthetic_decision.deterministicFanoutContentDigest ==
                  artifacts.verification.deterministicFanoutContentDigest &&
                  artifacts.human_aesthetic_decision.deterministicFanoutWorkflowRunId ==
                  artifacts.verification.deterministicFanoutWorkflowRunId &&
                  artifacts.human_aesthetic_decision.policySweepResourceName ==
                  artifacts.verification.policySweepResourceName &&
                  artifacts.human_aesthetic_decision.policySweepWorkflowId ==
                  artifacts.verification.policySweepWorkflowId &&
                  artifacts.human_aesthetic_decision.policySweepWorkflowName ==
                  artifacts.verification.policySweepWorkflowName &&
                  artifacts.human_aesthetic_decision.policySweepWorkflowVersion ==
                  artifacts.verification.policySweepWorkflowVersion &&
                  artifacts.human_aesthetic_decision.policySweepWorkflowRunId ==
                  artifacts.verification.policySweepWorkflowRunId &&
                  artifacts.human_aesthetic_decision.policySweepExecutionDigest ==
                  artifacts.verification.policySweepExecutionDigest &&
                  artifacts.human_aesthetic_decision.policyReceipts ==
                  artifacts.verification.policyReceipts &&
                  artifacts.human_aesthetic_decision.corpusReceipt ==
                  artifacts.verification.corpusReceipt &&
                  artifacts.human_aesthetic_decision.renderMatrixRunName ==
                  artifacts.verification.renderMatrixRunName &&
                  artifacts.human_aesthetic_decision.renderMatrixManifestName ==
                  artifacts.verification.renderMatrixManifestName &&
                  artifacts.human_aesthetic_decision.renderMatrixBundleName ==
                  artifacts.verification.renderMatrixBundleName &&
                  artifacts.human_aesthetic_decision.verificationWorkflowRunId ==
                  artifacts.verification.workflowRunId &&
                  artifacts.human_aesthetic_decision.renderMatrixManifestDigest ==
                  artifacts.verification.renderMatrixManifestDigest &&
                  artifacts.human_aesthetic_decision.renderMatrixBundleDigest ==
                  artifacts.verification.renderMatrixBundleDigest &&
                  artifacts.human_aesthetic_decision.renderMatrixRunDigest ==
                  artifacts.verification.renderMatrixRunDigest &&
                  artifacts.human_aesthetic_decision.renderEvidenceArchiveDigest ==
                  artifacts.verification.renderEvidenceArchiveDigest
                message: acceptance requires the trusted current evidence-bound human decision
        - name: human-revision
          to: implementation
          gates:
            - type: workflow-succeeded
              config:
                workflow: supers-bind-human-aesthetic-decision
                requireStepOutputs:
                  - artifact-human-aesthetic-decision
                  - evidence-human-aesthetic-decision-run
            - type: artifact-fresh
              config:
                artifact: human-aesthetic-decision
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.human_aesthetic_decision.decision == "reject" &&
                  artifacts.human_aesthetic_decision.integratedRevision ==
                  artifacts.verification.integratedRevision &&
                  artifacts.human_aesthetic_decision.integratedTreeFingerprint ==
                  artifacts.verification.integratedTreeFingerprint &&
                  artifacts.human_aesthetic_decision.treeFingerprint ==
                  artifacts.verification.treeFingerprint &&
                  artifacts.human_aesthetic_decision.deterministicFanoutResourceName ==
                  artifacts.verification.deterministicFanoutResourceName &&
                  artifacts.human_aesthetic_decision.deterministicFanoutContentDigest ==
                  artifacts.verification.deterministicFanoutContentDigest &&
                  artifacts.human_aesthetic_decision.deterministicFanoutWorkflowRunId ==
                  artifacts.verification.deterministicFanoutWorkflowRunId &&
                  artifacts.human_aesthetic_decision.policySweepResourceName ==
                  artifacts.verification.policySweepResourceName &&
                  artifacts.human_aesthetic_decision.policySweepWorkflowId ==
                  artifacts.verification.policySweepWorkflowId &&
                  artifacts.human_aesthetic_decision.policySweepWorkflowName ==
                  artifacts.verification.policySweepWorkflowName &&
                  artifacts.human_aesthetic_decision.policySweepWorkflowVersion ==
                  artifacts.verification.policySweepWorkflowVersion &&
                  artifacts.human_aesthetic_decision.policySweepWorkflowRunId ==
                  artifacts.verification.policySweepWorkflowRunId &&
                  artifacts.human_aesthetic_decision.policySweepExecutionDigest ==
                  artifacts.verification.policySweepExecutionDigest &&
                  artifacts.human_aesthetic_decision.policyReceipts ==
                  artifacts.verification.policyReceipts &&
                  artifacts.human_aesthetic_decision.corpusReceipt ==
                  artifacts.verification.corpusReceipt &&
                  artifacts.human_aesthetic_decision.renderMatrixRunName ==
                  artifacts.verification.renderMatrixRunName &&
                  artifacts.human_aesthetic_decision.renderMatrixManifestName ==
                  artifacts.verification.renderMatrixManifestName &&
                  artifacts.human_aesthetic_decision.renderMatrixBundleName ==
                  artifacts.verification.renderMatrixBundleName &&
                  artifacts.human_aesthetic_decision.verificationWorkflowRunId ==
                  artifacts.verification.workflowRunId &&
                  artifacts.human_aesthetic_decision.renderMatrixManifestDigest ==
                  artifacts.verification.renderMatrixManifestDigest &&
                  artifacts.human_aesthetic_decision.renderMatrixBundleDigest ==
                  artifacts.verification.renderMatrixBundleDigest &&
                  artifacts.human_aesthetic_decision.renderMatrixRunDigest ==
                  artifacts.verification.renderMatrixRunDigest &&
                  artifacts.human_aesthetic_decision.renderEvidenceArchiveDigest ==
                  artifacts.verification.renderEvidenceArchiveDigest
                message: revision requires the trusted current evidence-bound human rejection
    - id: reconciliation
      description: Confirm the terminal disposition and prepare exact Dex completion inputs.
      maxCycles: 5
      maxDispatchesPerCycle: 2
      work:
        mode: interactive
        context:
          inject:
            - change-summary
            - verification
        systemPrompt: >-
          Prepare the exact Dex completion result and commit decision from already verified
          integration evidence. Do not mutate the repository or tracker, assess aesthetics, or route
          rework.
      artifacts:
        - name: reconciliation
          description: Terminal disposition and typed Dex completion inputs.
          reviews: verification
          schema:
            type: object
            required:
              - status
              - nextStep
              - summary
              - completionResult
              - commit
              - dexDisposition
            properties:
              status:
                type: string
                enum:
                  - ready
              nextStep:
                type: string
                enum:
                  - complete
              summary:
                type: string
                minLength: 1
              completionResult:
                type: string
                minLength: 1
              commit:
                type: object
                required:
                  - kind
                properties:
                  kind:
                    type: string
                    enum:
                      - commit
                      - noCommit
                  sha:
                    type: string
                    pattern: '^[0-9a-fA-F]{7,40}$'
              dexDisposition:
                type: string
                enum:
                  - ready-for-completion
                  - reframed
      transitions:
        - name: postflight
          to: postflight
          gates:
            - type: artifact-fresh
              config:
                artifact: reconciliation
                recordedThisCycle: true
            - type: cel
              config:
                expr: >-
                  artifacts.reconciliation.status == "ready" && artifacts.reconciliation.nextStep ==
                  "complete"
                message: postflight requires status=ready and nextStep=complete
    - id: postflight
      description: Run the consumer terminal policy adapter before tracker completion.
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: factory-postflight-sweep
          inputs:
            workItem: '${{ self.workItem }}'
            evidenceName: postflight-run
            expectedFingerprint: '${{ data.latest(self.name, "artifact-change-impact").payload.changeFingerprint }}'
        inputsSchema:
          type: object
          properties:
            workItem:
              type: string
              minLength: 1
            evidenceName:
              type: string
              enum:
                - postflight-run
            expectedFingerprint:
              type: string
              pattern: '^[0-9a-f]{64}$'
          required:
            - workItem
            - evidenceName
            - expectedFingerprint
          additionalProperties: false
        resultEvidence: postflight-run
      transitions:
        - name: cleanup
          to: terminal-cleanup
          gates:
            - type: workflow-succeeded
              config:
                workflow: factory-postflight-sweep
                requireStepOutputs:
                  - evidence-postflight-run
            - type: human-approval
              config:
                id: completion-approval
        - name: human-revision
          to: implementation
          gates:
            - type: workflow-succeeded
              config:
                workflow: factory-postflight-sweep
                requireStepOutputs:
                  - evidence-postflight-run
            - type: cel
              config:
                expr: >-
                  has(approvals.completion_approval) &&
                  approvals.completion_approval.exists(approval, approval.decision == "rejected")
                message: human revision requires an explicit completion-approval rejection
    - id: terminal-cleanup
      description: >-
        Complete the Dex task only through the repository completion workflow after explicit
        task-specific human approval.
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: supers-complete-human-approved-task
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          required:
            - workItem
          additionalProperties: false
          properties:
            workItem:
              type: string
              minLength: 1
        resultEvidence: tracker-completion
      transitions:
        - name: finish
          to: done-observability
          gates:
            - type: evidence-recorded
              config:
                name: tracker-completion
                requireField:
                  status: succeeded
    - id: done-observability
      description: 'Finalize done, persist canonical Factory reports, and emit non-gating observability.'
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: supers-delivery-terminal-observability
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          required:
            - workItem
          additionalProperties: false
          properties:
            workItem:
              type: string
              minLength: 1
      transitions:
        - name: finalize
          to: done
    - id: aborted-observability
      description: 'Finalize aborted, persist canonical Factory reports, and emit non-gating observability.'
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: supers-delivery-terminal-observability
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          required:
            - workItem
          additionalProperties: false
          properties:
            workItem:
              type: string
              minLength: 1
      transitions:
        - name: finalize
          to: aborted
    - id: done
      terminal: true
    - id: aborted
      terminal: true
  globalTransitions:
    - name: abort
      to: aborted-observability
      gates:
        - type: human-approval
          config:
            id: abort-confirmation
id: 90fac686-c724-4aee-97c4-e31b9af4c5e2
name: supers-delivery
tags:
  purpose: supers-delivery
reports:
  require:
    - name: '@swamp/software-factory/work-item-summary'
      methods:
        - summary
    - name: '@mgreten/software-factory-flow-metrics'
      methods:
        - summary
methods: {}
