                    type: boolean
                  routingWorkflowRunBound:
                    type: boolean
              renderMatrixRunName:
                type: string
                minLength: 1
              renderMatrixManifestName:
                type: string
              renderMatrixBundleName:
                type: string
              renderMatrixManifestDigest:
                type: string
                pattern: '^$|^[0-9a-f]{64}$'
              renderMatrixBundleDigest:
                type: string
                pattern: '^$|^[0-9a-f]{64}$'
              renderMatrixRunDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
              renderEvidenceArchiveDigest:
                type: string
                pattern: '^$|^[0-9a-f]{64}$'
              workflowRunId:
                type: string
                minLength: 1
              requiredHumanReviewKinds:
                type: array
                maxItems: 2
                items:
                  type: string
                  enum:
