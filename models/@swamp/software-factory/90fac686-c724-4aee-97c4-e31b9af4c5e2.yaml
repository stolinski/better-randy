                  artifacts.human_aesthetic_decision.renderMatrixRunDigest ==
                  artifacts.verification.renderMatrixRunDigest &&
                  artifacts.human_aesthetic_decision.renderEvidenceArchiveDigest ==
                  artifacts.verification.renderEvidenceArchiveDigest
