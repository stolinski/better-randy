              authorityReceiptName:
                type: string
                pattern: '^factory-execution-failure-[A-Za-z0-9._:-]+$'
              authorityDigest:
                type: string
                pattern: '^[0-9a-f]{64}$'
      transitions:
        - name: accept
          to: reconciliation
          gates:
            - type: workflow-succeeded
