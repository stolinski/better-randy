                  type: string
                  pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
                createTasks:
                  type: array
                  maxItems: 250
                  items:
                    type: object
                    properties:
                      clientRef:
                        type: string
                        pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
