                  pattern: '^[0-9a-f]{64}$'
                trackerInventoryFingerprint:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                intentFingerprint:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                fingerprint:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
              required:
