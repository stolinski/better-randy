              config:
                artifact: plan-review-findings
                recordedThisCycle: true
            - type: artifact-fresh
              config:
                artifact: plan-review-verdict
                recordedThisCycle: true
            - type: findings-clear
              config:
                artifact: plan-review-findings
                blocking:
                  - critical
                  - high
                  - medium
            - type: cel
              config:
                expr: artifacts.plan_review_verdict.status == "accept"
                message: application requires an explicit accept verdict
            - type: cel
              config:
                expr: artifacts.application_bundle.approvalRequired == false
                message: approval-free application requires a validated no-approval bundle
        - name: approve-and-apply
          to: plan-application
          gates:
            - type: artifact-fresh
              config:
                artifact: plan-review-findings
                recordedThisCycle: true
            - type: artifact-fresh
              config:
                artifact: plan-review-verdict
                recordedThisCycle: true
            - type: findings-clear
              config:
                artifact: plan-review-findings
                blocking:
                  - critical
                  - high
                  - medium
            - type: cel
              config:
                expr: artifacts.plan_review_verdict.status == "accept"
                message: application requires an explicit accept verdict
            - type: cel
              config:
                expr: artifacts.application_bundle.approvalRequired == true
                message: graduation application requires an approval-bound bundle
            - type: human-approval
              config:
                id: planning-approval
                minApprovals: 1
        - name: human-reject
          to: rejected-observability
          gates:
            - type: artifact-fresh
              config:
                artifact: plan-review-findings
                recordedThisCycle: true
            - type: artifact-fresh
              config:
                artifact: plan-review-verdict
                recordedThisCycle: true
            - type: findings-clear
              config:
                artifact: plan-review-findings
                blocking:
                  - critical
                  - high
                  - medium
            - type: cel
              config:
                expr: artifacts.plan_review_verdict.status == "accept"
                message: application requires an explicit accept verdict
            - type: cel
              config:
                expr: artifacts.application_bundle.approvalRequired == true
                message: human rejection applies only to approval-bound bundles
            - type: cel
              config:
                expr: >-
                  has(approvals.planning_approval) && approvals.planning_approval.exists(approval,
                  approval.stageId == state.stageId && approval.cycle == state.cycles[state.stageId]
                  && approval.decision == "rejected")
                message: rejection requires an explicit current-cycle planning-approval human decision
        - name: reject
          to: rejected-observability
          gates:
            - type: artifact-fresh
              config:
                artifact: plan-review-findings
                recordedThisCycle: true
            - type: artifact-fresh
              config:
                artifact: plan-review-verdict
                recordedThisCycle: true
            - type: cel
              config:
                expr: artifacts.plan_review_verdict.status == "reject"
                message: rejection requires an explicit reject verdict
        - name: park
