      description: Independently review the complete validated application bundle.
      maxCycles: 3
      maxDispatchesPerCycle: 2
      work:
        mode: dispatch
        skills:
          - code-review
        systemPrompt: >-
          Independently review the complete validated application-bundle, documentation effects,
          source/destination/index preimages and postimages, cleanup order, approval requirement,
          and route-correct Dex graph. Reject or park without mutating the current tier.
        context:
          inject:
            - planning-inventory
            - tracker-inventory
            - clarified-intent
            - documentation-effects
            - dex-graph-proposal
            - application-bundle
            - application-bundle-validation
      artifacts:
        - name: plan-review-findings
          kind: findings
          reviews: application-bundle
        - name: plan-review-verdict
          reviews: application-bundle
          schema:
            type: object
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 1
              status:
                type: string
                enum:
                  - accept
                  - revise
                  - reject
                  - park
              summary:
                type: string
                minLength: 1
            required:
              - schemaVersion
              - status
              - summary
            additionalProperties: false
      transitions:
        - name: reinventory
          to: inventory
          gates:
            - type: artifact-fresh
              config:
                artifact: plan-review-findings
                recordedThisCycle: true
            - type: artifact-fresh
              config:
                artifact: plan-review-verdict
                recordedThisCycle: true
            - type: cel
              config:
                expr: artifacts.plan_review_verdict.status == "revise"
                message: reinventory requires an explicit revise verdict
        - name: revise
