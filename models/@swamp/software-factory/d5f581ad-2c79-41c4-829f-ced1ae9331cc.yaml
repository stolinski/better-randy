                  artifacts.approved_plan.planHash == artifacts.dex_graph_proposal.planHash &&
                  artifacts.approved_plan.proposalPlanHash == artifacts.dex_graph_proposal.planHash
                  && artifacts.approved_plan.approvalGateId ==
                  (artifacts.application_bundle.approvalRequired ? "planning-approval" :
                  "not-required")
                message: >-
                  recorded application boundary must retain the reviewed plan and exact approval
                  disposition
            - type: artifact-fresh
              config:
                artifact: plan-application
