    - id: handoff
      description: Expose one typed planning result without starting Delivery or creating more work.
      maxCycles: 1
      maxDispatchesPerCycle: 2
      work:
        mode: interactive
        systemPrompt: >-
          Record ready only for an audited planning-to-dex bundle with verified mappings. Record
          no-ready-work for audited capture, idea-to-roadmap, or roadmap-to-planning bundles. Do not
          start Delivery or mutate Dex.
        context:
          inject:
            - approved-plan
            - plan-application
            - planning-audit
            - application-bundle
            - application-bundle-validation
      artifacts:
        - name: planning-handoff
          description: Planning outcome for a later Delivery handoff; this profile does not start delivery.
          reviews: planning-audit
          schema:
            type: object
            properties:
              schemaVersion:
                type: integer
                enum:
                  - 1
              status:
                type: string
                enum:
                  - ready
                  - no-ready-work
                  - human-gate
              planId:
                type: string
                minLength: 1
              candidateTaskId:
                type: string
                pattern: '^[A-Za-z0-9_-]{1,128}$'
              approvedEpicTaskId:
                type: string
                pattern: '^[A-Za-z0-9_-]{1,128}$'
              summary:
                type: string
                minLength: 1
            required:
              - schemaVersion
              - status
              - planId
              - summary
            additionalProperties: false
      transitions:
        - name: finish
          to: done-observability
          gates:
            - type: artifact-fresh
              config:
                artifact: planning-handoff
                recordedThisCycle: true
    - id: done-observability
      description: 'Finalize done, persist canonical Factory reports, and emit non-gating observability.'
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: supers-planning-terminal-observability
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          required:
            - workItem
          additionalProperties: false
          properties:
            workItem:
              type: string
              minLength: 1
      transitions:
        - name: finalize
          to: done
    - id: rejected-observability
      description: 'Finalize rejected, persist canonical Factory reports, and emit non-gating observability.'
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: supers-planning-terminal-observability
          inputs:
            workItem: '${{ self.workItem }}'
        inputsSchema:
          type: object
          required:
            - workItem
          additionalProperties: false
          properties:
            workItem:
              type: string
              minLength: 1
      transitions:
        - name: finalize
          to: rejected
    - id: parked-observability
      description: 'Finalize parked, persist canonical Factory reports, and emit non-gating observability.'
      maxDispatchesPerCycle: 2
      work:
        mode: workflow
        workflow:
          name: supers-planning-terminal-observability
          inputs:
