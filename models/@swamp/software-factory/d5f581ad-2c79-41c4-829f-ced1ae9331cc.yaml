          gates:
            - type: artifact-fresh
              config:
                artifact: plan-review-findings
                recordedThisCycle: true
            - type: artifact-fresh
              config:
                artifact: plan-review-verdict
                recordedThisCycle: true
            - type: cel
              config:
                expr: artifacts.plan_review_verdict.status == "park"
                message: parking requires an explicit park verdict
