                - planningInventoryFingerprint
                - fingerprint
              additionalProperties: false
            documentationEffects:
              type: object
              properties:
                schemaVersion:
                  type: integer
                  enum:
                    - 1
                effects:
                  type: array
                  items:
                    type: object
                    properties:
                      operation:
