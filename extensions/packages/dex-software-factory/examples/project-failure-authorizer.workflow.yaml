id: 5d6a2678-17de-4e94-a17a-1a69cf85fa71
name: project-failure-authorizer
description: Re-read a profile-owned execution failure and record it on the exact target Factory dispatch.
tags:
  purpose: factory-operational-failure-authority
inputs:
  type: object
  additionalProperties: false
  required:
    - profileModelName
    - sourceFactoryModelName
    - receiptName
    - sourceFactoryId
    - workItem
    - stage
    - stageCycle
    - dispatchAttempt
    - dispatchRunId
  properties:
    profileModelName: { type: string, pattern: '^[a-z][a-z0-9_-]*$' }
    sourceFactoryModelName: { type: string, pattern: '^[a-z][a-z0-9_-]*$' }
    receiptName: { type: string, pattern: '^factory-execution-failure-[0-9a-f]{64}$' }
    sourceFactoryId: { type: string, minLength: 1 }
    workItem: { type: string, minLength: 1 }
    stage: { type: string, minLength: 1 }
    stageCycle: { type: integer, minimum: 1 }
    dispatchAttempt: { type: integer, minimum: 1 }
    dispatchRunId: { type: string, pattern: '^[0-9a-f]{64}$' }
jobs:
  - name: main
    description: Verify exact current-dispatch identity in the trusted profile, then record only its stored receipt.
    steps:
      - name: authorize-owned-failure
        task:
          type: model_method
          modelIdOrName: ${{ inputs.profileModelName }}
          methodName: authorize_execution_failure
          inputs:
            receiptName: ${{ inputs.receiptName }}
            sourceFactoryId: ${{ inputs.sourceFactoryId }}
            workItem: ${{ inputs.workItem }}
            stage: ${{ inputs.stage }}
            stageCycle: ${{ inputs.stageCycle }}
            dispatchAttempt: ${{ inputs.dispatchAttempt }}
            dispatchRunId: ${{ inputs.dispatchRunId }}
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: record-authorized-failure
        task:
          type: model_method
          modelIdOrName: ${{ inputs.sourceFactoryModelName }}
          methodName: record_artifact
          inputs:
            workItem: ${{ inputs.workItem }}
            name: ${{ inputs.stage + '-execution-failure' }}
            payload: ${{ data.query('modelName == "' + inputs.profileModelName + '" && specName == "authorized-failure" && workflowRunId == "' + run.id + '"').filter(record, record.attributes.workItem == inputs.workItem && record.attributes.stage == inputs.stage && record.attributes.stageCycle == inputs.stageCycle && record.attributes.dispatchAttempt == inputs.dispatchAttempt && record.attributes.dispatchRunId == inputs.dispatchRunId)[0].attributes }}
        dependsOn:
          - step: authorize-owned-failure
            condition: { type: succeeded }
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
