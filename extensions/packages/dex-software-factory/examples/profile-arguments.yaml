profileName: example-delivery
adapters:
  preflight:
    mode: workflow
    workflow: example-preflight
  classify:
    mode: workflow
    workflow: example-classify-change
  verification:
    mode: interactive
    systemPrompt: >-
      Execute every verification lane declared by the change-impact artifact.
      Record one bounded result per lane and route failed evidence to rework.
  postflight:
    mode: workflow
    workflow: example-postflight
  dexTracker:
    modelIdOrName: consumer-dex-tracker
    completeMethodName: complete
    completionWorkflow: complete-human-approved-task
implementation:
  systemPrompt: >-
    Implement only the current work item, follow repository guidance, and
    record a concise change summary before requesting verification.
completionGate:
  id: completion-approval
  minApprovals: 1
contracts:
  changeSummary:
    properties:
      changedAreas:
        type: array
        items:
          type: string
          minLength: 1
    required:
      - changedAreas
budgets:
  implementation: 3
  verification: 3
  review: 2
  reconciliation: 2
  maxDispatchesPerCycle: 2
